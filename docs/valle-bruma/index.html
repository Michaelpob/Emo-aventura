<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>El Valle de la Bruma · Isla de la Tristeza</title>
<!--
  ============================================================================
  EL VALLE DE LA BRUMA · ISLA DE LA TRISTEZA
  Dos mini-juegos psicoeducativos en un solo archivo (HTML + CSS + JS, canvas 2D
  para el paisaje y la bruma, DOM para fichas, cartas y paneles, Web Audio API
  para un ambiente mínimo). Sin librerías ni recursos externos.

  La tristeza se representa por AUSENCIA (de color, de sonido, de velocidad),
  nunca como enemigo ni como oscuridad amenazante. No hay reloj, ni reflejos,
  ni vidas, ni puntaje negativo: el ritmo lo marca quien juega.

  MAPA MECÁNICA → FASE PSICOEDUCATIVA → CONSTRUCTO TEÓRICO
  ----------------------------------------------------------------------------
  | Mecánica                                    | Fase            | Constructo                                                |
  |---------------------------------------------|-----------------|-----------------------------------------------------------|
  | Masa gris amorfa sin nombre; solo EMPEZAR   | SENTIR (M1)     | Sensación difusa previa al lenguaje; la tristeza como      |
  |                                             |                 | señal adaptativa de pérdida (Nesse, 2000)                 |
  | Arrastrar hasta 3 fichas de matiz al cuenco;| NOMBRAR (M1)    | Etiquetado afectivo (affect labeling, Lieberman et al.,   |
  | cada ficha da forma y un tenue color a la   |                 | 2007): poner palabras a la emoción reduce su activación   |
  | bruma                                       |                 | y la hace más precisa, no más grande                      |
  | Plantilla con huecos + banco de fragmentos  | NARRAR (M1)     | Escritura expresiva (Pennebaker & Beall, 1986): narrar la |
  | + comodín de texto libre; sin frase correcta|                 | causa y lo que cuesta organiza la experiencia             |
  | Barco de papel: DEJARLA IR / GUARDARLA /    | SOLTAR (M1)     | Rumia vs. reflexión (Nolen-Hoeksema, 1991; 2008): releer  |
  | LEERLA OTRA VEZ; tres relecturas seguidas   |                 | en bucle estanca el río (rumia); preguntarse qué necesito |
  | estancan el río y abren la rama de rumia    |                 | reorienta al siguiente paso (reflexión). Rama explícita   |
  | Energía baja (20/100) que NO se gasta al    | DETECTAR (M2)   | Activación conductual (Lewinsohn, 1974): la acción        |
  | actuar sino que se recupera                 |                 | precede a la motivación; conservación de energía (Nesse)  |
  | Mano de 4 cartas en tres categorías con     | ELEGIR (M2)     | Programación de actividades de dominio y agrado (Martell, |
  | esfuerzo 1-3 + DESCANSAR siempre disponible |                 | Dimidjian & Herman-Dunn, 2010); descansar es una decisión |
  | Racha de pasos pequeños con bonus creciente;| ACTUAR (M2)     | Pasos pequeños y sostenidos rinden más que grandes y      |
  | carta grande con poca energía "a medias"    |                 | aislados; cada acción despeja bruma y devuelve un color   |
  | Resumen: cartas, energía por turno,         | REGISTRAR (M2)  | Monitoreo de actividad y estado de ánimo: la energía      |
  | secuencia más eficiente                     |                 | aparece después de la acción y crece con la constancia    |
  | Selección de estrategia con sugerencia no   | Flujo compartido| Autonomía: la sugerida orienta según la intensidad, no    |
  | obligatoria                                 |                 | obliga; elegir otra no resta nada                         |
  | Reevaluación BAJA/MEDIA/ALTA sin respuesta  | Flujo compartido| Metacognición emocional: comparar intensidad inicial y    |
  | correcta + retroalimentación                |                 | final sin optimismo forzado                               |
  ----------------------------------------------------------------------------

  EN QUÉ DIFIERE, A PROPÓSITO, DE LA ISLA DE LA ALEGRÍA (Valle de la Luz)
  · Composición de lenguaje (fichas y fragmentos que se arrastran) en lugar de
    control de un medidor en tiempo real.
  · Planificación por turnos con cartas y tablero fijo en lugar de plataformas,
    saltos y desplazamiento continuo.
  · La energía se RECUPERA al actuar (lógica invertida): allí se gastaba con
    cada salto; aquí cada paso pequeño devuelve más que el anterior.
  · Sin reloj, sin presión de input, sin cuenta regresiva: "no hacer nada"
    (DESCANSAR, SEGUIR MIRÁNDOLA) es una jugada válida y nunca se penaliza.
  · Estímulo visual por ausencia: bruma, desaturación y silencio; el color entra
    de a poco y nunca llega al brillo de la Alegría.

  CÓMO PROBARLO (menos de 6 minutos)
  1. Abre este archivo con doble clic en un navegador moderno. No hace falta
     servidor. Parámetros opcionales en la URL: `?intensidad=BAJA|MEDIA|ALTA`
     (con la que "llegas" a la fase) y `?rapido=1` (sendero de 4 casillas y
     animaciones más cortas).
  2. Pantalla de estrategia: cambia la intensidad con la que llegas y observa
     cómo cambia la sugerida. Pulsa "VER OTRA ESTRATEGIA": aparece el aviso de
     estrategia no sugerida sin restar nada. "CONTINUAR CON ESTA ESTRATEGIA".
  3. Mini-juego 1 (El río de las palabras), ~2 min:
     · SENTIR: lee y pulsa EMPEZAR.
     · NOMBRAR: arrastra (o toca / Enter) hasta 3 fichas al cuenco. Tras la
       primera aparece el micro-mensaje. Pulsa "Continuar".
     · NARRAR: toca o arrastra fragmentos a los dos huecos; prueba el comodín
       [escribir lo mío]. Rehaz la frase si quieres. "Continuar".
     · SOLTAR: pulsa "LEERLA OTRA VEZ" tres veces seguidas para ver el río
       estancarse y la rama de rumia (SEGUIR MIRÁNDOLA / PREGUNTARME QUÉ
       NECESITO). Luego elige DEJARLA IR o GUARDARLA → 🕯️ Farol de las palabras.
  4. Caja de herramientas → Reevaluación (BAJA/MEDIA/ALTA) → Retroalimentación.
     Pulsa "PRACTICAR OTRA ESTRATEGIA".
  5. Mini-juego 2 (El sendero de los pasos pequeños), ~2 min: DETECTAR (lee) →
     ELEGIR/ACTUAR: juega dos o tres cartas de esfuerzo 1-2 seguidas y mira el
     bonus de racha; luego una de esfuerzo 3 con energía < 30 para ver "Fue mucho
     de una vez"; juega DESCANSAR (nunca penaliza). Desde el turno 3 aparece
     TERMINAR AQUÍ. Al llegar a la salida → REGISTRAR → 🌱 Semilla del primer paso.
  6. En la consola: `sessionLog` (partida actual), `sessionLogs` (todas) y
     `exportarSessionLog()` devuelve el JSON. El texto libre nunca sale del
     navegador: vive solo en memoria de sesión.
  ============================================================================
-->
<style>
  :root {
    --bruma: #c7d1d6;
    --bruma-densa: #aab7be;
    --tinta: #1f2c34;
    --tinta-suave: #4a5a63;
    --azul: #5b7787;
    --musgo: #6c7f69;
    --ambar: #b9935f;
    --terracota: #a8705a;
    --blanco-frio: #edf2f4;
    --panel: rgba(237, 242, 244, 0.95);
    --oscuro: rgba(31, 44, 52, 0.8);
    --sombra: 0 18px 50px rgba(10, 20, 26, 0.35);
    --fuente: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", sans-serif;
    --texto: clamp(16px, 1.55vw, 20px);
    --lento: 420ms;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #1c262c; color: var(--tinta); font-family: var(--fuente); overflow: hidden; }
  button { font: inherit; }
  :focus-visible { outline: 3px solid var(--ambar); outline-offset: 3px; }

  /* ---------------------------------------------------------------- marco */
  #marco { position: fixed; inset: 0; display: grid; place-items: center; }
  #escena { position: relative; width: 1280px; height: 720px; }
  #lienzo { display: block; width: 100%; height: 100%; border-radius: 14px; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45); touch-action: none; }
  /* La capa DOM ocupa toda la ventana (no solo el lienzo 16:9): en un
     celular vertical los paneles, fichas y cartas usan la pantalla completa
     y el lienzo queda como paisaje de fondo en el centro. */
  #capa { position: fixed; inset: 0; pointer-events: none; }
  #capa > * { pointer-events: auto; }

  /* ------------------------------------------------------------------ HUD */
  #hud { position: absolute; top: 12px; left: 14px; right: 14px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; pointer-events: none; z-index: 5; }
  #hud > * { pointer-events: auto; }
  #fases { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 12px; border-radius: 999px; background: var(--oscuro); color: #fff; font-size: clamp(14px, 1.2vw, 17px); letter-spacing: 0.06em; font-weight: 700; backdrop-filter: blur(6px); }
  #fases:empty { display: none; }
  #fases span { opacity: 0.45; }
  #fases span.hecha { opacity: 0.8; }
  #fases span.actual { opacity: 1; color: #e9d3ac; }
  #fases i { font-style: normal; opacity: 0.4; }
  #opciones { display: flex; gap: 8px; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 6px 12px; border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 999px; background: var(--oscuro); color: #fff; font-size: 16px; cursor: pointer; backdrop-filter: blur(6px); }
  .chip input { accent-color: var(--ambar); width: 18px; height: 18px; }

  /* barra de energía (M2): se recupera al actuar */
  #energia { position: absolute; left: 50%; top: 66px; transform: translateX(-50%); width: min(560px, 74%); padding: 8px 14px 10px; border-radius: 14px; background: var(--oscuro); color: #fff; backdrop-filter: blur(6px); z-index: 4; }
  #energia[hidden] { display: none; }
  #energia .fila { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; margin-bottom: 6px; }
  #energia .pista { height: 14px; border-radius: 999px; background: rgba(255, 255, 255, 0.16); overflow: hidden; }
  #energia .relleno { height: 100%; width: 20%; border-radius: 999px; background: linear-gradient(90deg, #8ea9b5, #b9935f); transition: width var(--lento) ease; }
  #energia .racha { color: #e9d3ac; }

  /* mensaje breve */
  #mensaje { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); max-width: min(760px, 90%); padding: 12px 20px; border-radius: 14px; background: var(--oscuro); color: #fff; font-size: var(--texto); line-height: 1.4; text-align: center; backdrop-filter: blur(6px); animation: aparecer var(--lento) ease; z-index: 6; }
  #mensaje[hidden] { display: none; }
  #mensaje.arriba { bottom: auto; top: 70px; }
  #mensaje.suave { background: var(--panel); color: var(--tinta); }

  /* -------------------------------------------------------------- paneles */
  #paneles { position: absolute; inset: 0; display: grid; place-items: center; padding: 64px 16px 16px; pointer-events: none; z-index: 7; }
  #paneles:empty { display: none; }
  .panel { pointer-events: auto; width: min(640px, 100%); max-height: 100%; overflow-y: auto; padding: clamp(18px, 2.6vw, 30px) clamp(18px, 3vw, 34px); border-radius: 22px; background: var(--panel); border: 1px solid rgba(91, 119, 135, 0.35); box-shadow: var(--sombra); animation: aparecer var(--lento) cubic-bezier(0.22, 1, 0.36, 1); font-size: var(--texto); line-height: 1.5; }
  .panel.ancho { width: min(900px, 100%); }
  .panel.abajo { align-self: end; }
  .panel.arriba { align-self: start; }
  .panel.translucido { background: rgba(237, 242, 244, 0.86); }
  .panel .eyebrow { margin: 0 0 6px; font-size: clamp(13px, 1.1vw, 15px); letter-spacing: 0.2em; text-transform: uppercase; color: var(--azul); font-weight: 800; }
  .panel h2 { margin: 0 0 10px; font-size: clamp(22px, 2.4vw, 30px); line-height: 1.15; color: var(--tinta); }
  .panel h3 { margin: 12px 0 8px; font-size: clamp(18px, 1.8vw, 22px); }
  .panel p { margin: 0 0 10px; color: var(--tinta-suave); }
  .panel p.cita { padding: 10px 14px; border-left: 4px solid var(--azul); background: #e1e9ec; color: var(--tinta); font-style: italic; }
  .panel p.clinico { padding: 14px 16px; border-radius: 12px; background: #e1e9ec; color: var(--tinta); font-weight: 600; font-size: clamp(17px, 1.7vw, 22px); line-height: 1.45; }
  .panel p.nota { font-size: clamp(15px, 1.3vw, 17px); }
  .acciones { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .boton { min-height: 46px; padding: 10px 18px; border: 1px solid rgba(31, 44, 52, 0.25); border-radius: 12px; background: #fff; color: var(--tinta); font-weight: 800; letter-spacing: 0.04em; cursor: pointer; transition: transform var(--lento) ease, background var(--lento) ease; }
  .boton:hover { transform: translateY(-1px); background: #f4f7f8; }
  .boton.primario { background: linear-gradient(180deg, #d9c39d, #b9935f); border-color: transparent; color: #1f1a12; }
  .boton.secundario { background: rgba(255, 255, 255, 0.7); }
  .boton[disabled] { opacity: 0.5; cursor: default; transform: none; }

  /* selector de intensidad y tarjetas de estrategia */
  .intensidad { display: inline-flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 4px 0 12px; }
  .intensidad span { font-size: 15px; color: var(--tinta-suave); margin-right: 4px; }
  .intensidad button { min-height: 38px; padding: 6px 14px; border: 2px solid rgba(31, 44, 52, 0.2); border-radius: 999px; background: #fff; font-weight: 800; letter-spacing: 0.06em; cursor: pointer; }
  .intensidad button[aria-pressed="true"] { border-color: var(--azul); background: #e1e9ec; }
  .tarjetas { display: grid; gap: 12px; margin: 12px 0 4px; grid-template-columns: 1fr 1fr; }
  .tarjeta { position: relative; display: grid; gap: 4px; padding: 18px 16px 14px; border: 2px solid rgba(31, 44, 52, 0.15); border-radius: 16px; background: #fff; text-align: left; cursor: pointer; transition: border-color var(--lento) ease, transform var(--lento) ease, box-shadow var(--lento) ease; }
  .tarjeta:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(10, 20, 26, 0.12); }
  .tarjeta.seleccionada { border-color: var(--azul); box-shadow: 0 0 0 4px rgba(91, 119, 135, 0.22); }
  .tarjeta .etiqueta { position: absolute; top: -12px; right: 14px; padding: 4px 10px; border-radius: 999px; background: var(--musgo); color: #fff; font-size: 13px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
  .tarjeta strong { font-size: clamp(18px, 1.8vw, 22px); color: var(--tinta); }
  .tarjeta em { font-style: normal; color: var(--azul); font-weight: 700; font-size: clamp(15px, 1.3vw, 17px); }
  .tarjeta span { color: var(--tinta-suave); font-size: clamp(15px, 1.3vw, 17px); }
  .tarjeta small { margin-top: 4px; color: var(--tinta-suave); font-size: 14px; letter-spacing: 0.06em; }
  .aviso { padding: 12px 14px; border-radius: 12px; background: #e6ece2; color: var(--tinta); font-size: clamp(15px, 1.35vw, 18px); }
  .aviso[hidden] { display: none; }

  /* opciones (reevaluación) */
  .opciones { display: grid; gap: 10px; margin-top: 10px; }
  .opciones.fila { grid-template-columns: repeat(3, 1fr); }
  .opcion { min-height: 52px; padding: 12px 16px; border: 2px solid rgba(31, 44, 52, 0.15); border-radius: 14px; background: #fff; font-weight: 700; cursor: pointer; text-align: left; transition: border-color var(--lento) ease, transform var(--lento) ease; }
  .opcion:hover { border-color: var(--azul); transform: translateY(-1px); }
  .opcion.grande { text-align: center; font-size: clamp(18px, 2vw, 24px); letter-spacing: 0.08em; }

  /* caja de herramientas */
  .herramientas { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0; }
  .herramienta { display: grid; gap: 4px; justify-items: center; padding: 18px 12px; border-radius: 16px; background: #fff; border: 2px solid rgba(31, 44, 52, 0.12); text-align: center; opacity: 0.45; }
  .herramienta.obtenida { opacity: 1; border-color: var(--ambar); }
  .herramienta.nueva { animation: latido 1.4s ease 2; box-shadow: 0 0 0 6px rgba(185, 147, 95, 0.22); }
  .herramienta .icono { font-size: 44px; line-height: 1; }
  .herramienta strong { font-size: clamp(16px, 1.5vw, 19px); }
  .herramienta span { font-size: 14px; color: var(--tinta-suave); }
  .herramienta .estado { font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 800; color: var(--ambar); }
  .registros { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
  .registros li { padding: 10px 12px; border-radius: 10px; background: #fff; border: 1px solid rgba(31, 44, 52, 0.12); font-style: italic; color: var(--tinta); font-size: clamp(15px, 1.3vw, 17px); }

  pre.registro { max-height: 32vh; overflow: auto; padding: 12px; border-radius: 12px; background: #1f2c34; color: #d8e3e8; font-size: 14px; line-height: 1.4; }
  .resumen { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0 10px; }
  .resumen span { padding: 6px 12px; border-radius: 999px; background: #fff; border: 1px solid rgba(31, 44, 52, 0.15); font-weight: 700; font-size: 15px; }

  /* ---------------------------------------------------- capa de juego DOM */
  #juego { position: absolute; inset: 0; pointer-events: none; }
  #juego:empty { display: none; }
  #juego > * { pointer-events: auto; }

  /* M1 · fichas de palabra */
  #fichas { position: absolute; inset: 0; pointer-events: none; }
  .ficha { position: absolute; left: var(--x); top: var(--y); transform: translate(-50%, -50%); pointer-events: auto; min-height: 42px; padding: 8px 16px; border: 1px solid rgba(31, 44, 52, 0.25); border-radius: 999px; background: rgba(237, 242, 244, 0.92); color: var(--tinta); font-size: 17px; font-weight: 700; letter-spacing: 0.02em; cursor: grab; touch-action: none; -webkit-user-select: none; user-select: none; box-shadow: 0 6px 18px rgba(10, 20, 26, 0.18); transition: box-shadow var(--lento) ease, background var(--lento) ease; }
  .ficha:hover { background: #fff; }
  .ficha.arrastrando { cursor: grabbing; z-index: 9; box-shadow: 0 14px 30px rgba(10, 20, 26, 0.3); transition: none; }
  .ficha.colocada { position: static; transform: none; cursor: pointer; background: #e6ece2; border-color: var(--musgo); }
  #cuenco { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); width: min(520px, 92%); min-height: 118px; padding: 12px 16px; border: 2px dashed rgba(237, 242, 244, 0.7); border-radius: 22px; background: rgba(31, 44, 52, 0.62); color: #fff; backdrop-filter: blur(6px); display: grid; gap: 8px; align-content: start; transition: border-color var(--lento) ease, background var(--lento) ease; }
  #cuenco.sobre { border-color: #e9d3ac; background: rgba(31, 44, 52, 0.78); }
  #cuenco .titulo { font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 800; opacity: 0.85; }
  #cuenco .slots { display: flex; flex-wrap: wrap; gap: 8px; min-height: 44px; align-items: center; }
  #cuenco .vacio { font-size: 15px; opacity: 0.7; }
  #cuenco .acciones { margin-top: 4px; }
  #cuenco .boton { min-height: 40px; }

  /* M1 · plantilla y fragmentos */
  .plantilla { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 0 14px; padding: 14px 16px; border-radius: 14px; background: #fff; border: 1px solid rgba(31, 44, 52, 0.12); font-size: clamp(17px, 1.7vw, 22px); line-height: 1.6; }
  .hueco { min-width: 150px; min-height: 40px; padding: 4px 12px; border: 2px dashed rgba(91, 119, 135, 0.6); border-radius: 10px; background: #e1e9ec; color: var(--tinta); font-weight: 700; cursor: pointer; text-align: left; transition: border-color var(--lento) ease, background var(--lento) ease; }
  .hueco.lleno { border-style: solid; background: #e6ece2; border-color: var(--musgo); }
  .hueco.fijo { border-style: solid; background: #efe7d8; border-color: var(--ambar); cursor: default; }
  .hueco.activo, .hueco.sobre { border-color: var(--ambar); background: #f3ecdf; }
  .banco { display: flex; flex-wrap: wrap; gap: 8px; }
  .fragmento { min-height: 40px; padding: 8px 14px; border: 1px solid rgba(31, 44, 52, 0.25); border-radius: 999px; background: #fff; color: var(--tinta); font-size: 16px; font-weight: 600; cursor: grab; touch-action: none; -webkit-user-select: none; user-select: none; transition: background var(--lento) ease, opacity var(--lento) ease; }
  .fragmento:hover { background: #f4f7f8; }
  .fragmento.usado { opacity: 0.35; }
  .fragmento.comodin { border-style: dashed; border-color: var(--ambar); background: #f7f1e6; }
  .fragmento.arrastrando { position: fixed; z-index: 30; cursor: grabbing; box-shadow: 0 14px 30px rgba(10, 20, 26, 0.3); pointer-events: none; }
  .plantilla .unidad { display: inline-flex; align-items: center; white-space: nowrap; }
  .libre { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .libre[hidden] { display: none; }
  .libre input { flex: 1; min-width: 200px; min-height: 42px; padding: 8px 12px; border: 2px solid rgba(91, 119, 135, 0.5); border-radius: 10px; font: inherit; font-size: 16px; color: var(--tinta); }
  .libre small { width: 100%; color: var(--tinta-suave); font-size: 14px; }
  .frase-final { font-size: clamp(18px, 1.9vw, 24px); font-style: italic; color: var(--tinta); padding: 12px 16px; border-left: 4px solid var(--ambar); background: #f7f1e6; border-radius: 6px; }

  /* M2 · mano de cartas */
  #mesa { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 16px 14px; display: grid; gap: 8px; pointer-events: none; }
  #mesa > * { pointer-events: auto; }
  #mesa .fila { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  #mesa .turno { display: inline-flex; gap: 6px; align-items: center; padding: 6px 12px; border-radius: 999px; background: var(--oscuro); color: #fff; font-size: 15px; font-weight: 700; letter-spacing: 0.06em; backdrop-filter: blur(6px); }
  #mano { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .carta { display: grid; gap: 6px; align-content: start; min-height: 150px; padding: 12px 12px 10px; border: 2px solid rgba(31, 44, 52, 0.15); border-radius: 16px; background: var(--panel); text-align: left; cursor: pointer; transition: transform var(--lento) ease, box-shadow var(--lento) ease, border-color var(--lento) ease; animation: aparecer var(--lento) ease; }

<script>

    claridadDejarIr: 0.38,
    claridadGuardar: 0.2,

    duracionVolver: RAPIDO ? 0.6 : 1.2,

    bonusRacha: 4,                        // energía extra por cada paso pequeño encadenado
    rachaMaxima: 4,
    umbralEnergiaBaja: 30,                // por debajo, una carta de esfuerzo 3 sale "a medias"

/* ----------------------------------------------------------------------------

const MAZO = [

    .map((n) => ({ nombre: n, categoria: 'cuidado', titulo: 'Cuidado básico', esfuerzo: 1 })),

    .map((n) => ({ nombre: n, categoria: 'movimiento', titulo: 'Movimiento y entorno', esfuerzo: 2 })),

    .map((n) => ({ nombre: n, categoria: 'conexion', titulo: 'Conexión y sentido', esfuerzo: 3 }))

const ORDEN_INTENSIDAD = { BAJA: 0, MEDIA: 1, ALTA: 2 };

/* ============================================================================
   ESTADO CENTRAL Y TELEMETRÍA
   ========================================================================== */
const GameState = {
  estado: null,
  intensidadInicial: CONFIG.intensidadInicial,
  estrategiaSugerida: CONFIG.sugeridaPorIntensidad[CONFIG.intensidadInicial],
  estrategiaElegida: null,
  herramientas: new Set(),
  ultimaHerramienta: null,

  intensidadFinal: null,

};

function nuevoSessionLog() {
  return {
    intensidadInicial: GameState.intensidadInicial,
    estrategiaSugerida: GameState.estrategiaSugerida,
    estrategiaElegida: null,
    minijuego: null,
    palabrasElegidas: [],
    fraseConstruida: null,
    usoDeTextoLibre: false,
    accionFinalDelBarco: null,
    vecesQueReleyo: 0,
    entroEnRamaDeRumia: false,
    cartasJugadas: [],
    secuenciaDeEsfuerzo: [],
    vecesQueDescanso: 0,
    energiaPorTurno: [],
    turnosTotales: 0,
    terminoAnticipadamente: false,
    recompensaObtenida: null,
    intensidadFinal: null,
    direccionDelCambio: null,

    fin: null
  };
}
window.sessionLog = nuevoSessionLog();
window.sessionLogs = [];
window.exportarSessionLog = () => JSON.stringify({ actual: window.sessionLog, todas: window.sessionLogs }, null, 2);

/* Cronómetro por fase (solo para telemetría: nunca se muestra un reloj) */
const Fases = {
  actual: null,
  inicio: 0,
  iniciar(nombre) {
    this.cerrar();
    this.actual = nombre;
    this.inicio = performance.now();
  },
  cerrar() {
    if (!this.actual) return;
    const seg = (performance.now() - this.inicio) / 1000;
    const log = window.sessionLog;
    log.tiempoPorFase[this.actual] = +((log.tiempoPorFase[this.actual] ?? 0) + seg).toFixed(1);
    this.actual = null;
  }
};

/* ============================================================================
   UTILIDADES
   ========================================================================== */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const suave = (t) => t * t * (3 - 2 * t);
const barajar = (lista) => { const a = [...lista]; for (let i = a.length - 1; i > 0; i -= 1) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const escapar = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const _cacheColor = new Map();
function hexRgb(h) {
  if (_cacheColor.has(h)) return _cacheColor.get(h);
  const n = parseInt(h.slice(1), 16);
  const rgb = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  _cacheColor.set(h, rgb);
  return rgb;
}
/* Mezcla dos colores hex según k (0 = a, 1 = b) */
function mezcla(a, b, k, alfa = 1) {
  const A = hexRgb(a); const B = hexRgb(b); const t = clamp(k, 0, 1);
  return `rgba(${Math.round(lerp(A[0], B[0], t))},${Math.round(lerp(A[1], B[1], t))},${Math.round(lerp(A[2], B[2], t))},${alfa})`;
}
/* Ruido determinista para un paisaje estable entre frames */
function ruido(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

/* La claridad se acerca a su objetivo despacio: la bruma nunca cambia de golpe */
const Claridad = {
  objetivo: 0,
  fijar(v) { this.objetivo = clamp(v, 0, 1); },
  sumar(v) { this.fijar(this.objetivo + v); },
  update(dt) { GameState.claridad = lerp(GameState.claridad, this.objetivo, 1 - Math.exp(-dt * 0.9)); }
};

/* ============================================================================
   AUDIO · ambiente mínimo: un dron grave y notas espaciadas de una escala
   menor pentatónica. El filtro se abre conforme la bruma se despeja.
   ========================================================================== */
const Audio = {
  ctx: null, master: null, filtro: null, listo: false, proximaNota: 0,
  escala: [0, 3, 5, 7, 10],                   // pentatónica menor
  tonica: 130.81,                             // Do3, registro grave
  init() {
    if (this.listo) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = GameState.sonido ? CONFIG.audio.volumen : 0;
      this.filtro = this.ctx.createBiquadFilter();
      this.filtro.type = 'lowpass';
      this.filtro.frequency.value = CONFIG.audio.filtroMin;
      this.filtro.connect(this.master).connect(this.ctx.destination);
      this.listo = true;
      this.dron();
      this.proximaNota = this.ctx.currentTime + 2;
    } catch (e) { this.listo = false; }
  },
  reanudar() { if (this.listo && this.ctx.state === 'suspended') this.ctx.resume(); },
  setSonido(on) {
    GameState.sonido = on;
    if (this.listo) this.master.gain.setTargetAtTime(on ? CONFIG.audio.volumen : 0, this.ctx.currentTime, 0.05);
  },
  dron() {
    [this.tonica / 2, this.tonica / 2 * 1.5].forEach((f, i) => {
      const o = this.ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
      const g = this.ctx.createGain(); g.gain.value = i === 0 ? 0.09 : 0.04;
      o.connect(g).connect(this.filtro); o.start();
    });
  },
  nota(freq, t, dur = 1.6, vol = 0.12, tipo = 'sine') {
    if (!this.listo) return;
    const o = this.ctx.createOscillator(); o.type = tipo; o.frequency.value = freq;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.25);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.filtro); o.start(t); o.stop(t + dur + 0.1);
  },
  /* Notas graves y espaciadas; más claridad = filtro más abierto y algo más de aire */
  update() {
    if (!this.listo || this.ctx.state !== 'running') return;
    const k = GameState.claridad;
    this.filtro.frequency.setTargetAtTime(lerp(CONFIG.audio.filtroMin, CONFIG.audio.filtroMax, k), this.ctx.currentTime, 0.6);
    const ahora = this.ctx.currentTime;
    if (ahora >= this.proximaNota) {
      const grado = this.escala[Math.floor(Math.random() * this.escala.length)] + (Math.random() < k * 0.6 ? 12 : 0);
      this.nota(this.tonica * Math.pow(2, grado / 12), ahora, 2.4, 0.1 + 0.05 * k, 'triangle');
      const [a, b] = CONFIG.audio.segundosEntreNotas;
      this.proximaNota = ahora + lerp(b, a, k) + Math.random() * 2;
    }
  },
  /* Sonidos puntuales: todos suaves, sin ataques bruscos */
  gota() { if (!this.listo) return; const t = this.ctx.currentTime; this.nota(this.tonica * 4, t, 0.6, 0.12); this.nota(this.tonica * 6, t + 0.06, 0.5, 0.06); },
  pling() { if (!this.listo) return; const t = this.ctx.currentTime; [7, 12].forEach((s, i) => this.nota(this.tonica * 2 * Math.pow(2, s / 12), t + i * 0.12, 0.9, 0.1)); },
  exito() { if (!this.listo) return; const t = this.ctx.currentTime; [0, 3, 7, 12].forEach((s, i) => this.nota(this.tonica * 2 * Math.pow(2, s / 12), t + i * 0.16, 1.4, 0.11)); },
  suavecito() { if (!this.listo) return; this.nota(this.tonica * 1.5, this.ctx.currentTime, 0.9, 0.08, 'triangle'); }
};

/* ============================================================================
   DOM, ENTRADA Y HUD
   ========================================================================== */
const lienzo = document.getElementById('lienzo');
const ctx2d = lienzo.getContext('2d');
const escena = document.getElementById('escena');

const Entrada = {

  /* coordenadas de un evento en el espacio 1280×720 del lienzo */
  aLienzo(e) {
    const r = lienzo.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (CONFIG.ancho / r.width), y: (e.clientY - r.top) * (CONFIG.alto / r.height) };

};
window.addEventListener('pointerdown', () => { Audio.init(); Audio.reanudar(); }, { passive: true });
window.addEventListener('keydown', () => { Audio.init(); Audio.reanudar(); }, { passive: true });

const Hud = {
  fases: document.getElementById('fases'),
  energia: document.getElementById('energia'),
  mensaje: document.getElementById('mensaje'),
  paneles: document.getElementById('paneles'),

  setFases(lista, actual) {
    if (!lista) { this.fases.innerHTML = ''; return; }
    const idx = lista.indexOf(actual);
    this.fases.innerHTML = lista.map((f, i) =>
      `<span class="${i < idx ? 'hecha' : i === idx ? 'actual' : ''}">${i < idx ? '✓ ' : ''}${f}</span>${i < lista.length - 1 ? '<i>→</i>' : ''}`
    ).join('');
  },
  setEnergia(valor, racha = 0) {
    if (valor === null) { this.energia.hidden = true; return; }
    this.energia.hidden = false;
    const v = Math.round(clamp(valor, 0, CONFIG.sendero.energiaMaxima));
    this.energia.querySelector('[data-relleno]').style.width = `${v}%`;
    this.energia.querySelector('[data-valor]').textContent = `${v} / ${CONFIG.sendero.energiaMaxima}`;
    this.energia.querySelector('[data-racha]').textContent = racha >= 2 ? `racha de pasos pequeños ×${racha}` : '';
  },
  /* Mensaje breve. `ms` 0 = fijo hasta que se cambie */
  decir(texto, { ms = 4200, suave = false, arriba = false } = {}) {
    clearTimeout(this._timerMensaje);
    if (!texto) { this.mensaje.hidden = true; return; }
    this.mensaje.textContent = texto;
    this.mensaje.className = `${suave ? 'suave' : ''} ${arriba ? 'arriba' : ''}`.trim();
    this.mensaje.hidden = false;
    if (ms) this._timerMensaje = setTimeout(() => { this.mensaje.hidden = true; }, ms);
  },
  /* Panel modal con título, html y botones. Devuelve el nodo. */
  panel({ eyebrow = '', titulo = '', html = '', botones = [], clase = '' } = {}) {
    this.paneles.innerHTML = '';
    const p = document.createElement('section');
    p.className = `panel ${clase}`;
    p.setAttribute('role', 'dialog');
    p.setAttribute('aria-label', titulo || eyebrow);
    p.innerHTML = `
      ${eyebrow ? `<p class="eyebrow">${eyebrow}</p>` : ''}
      ${titulo ? `<h2>${titulo}</h2>` : ''}
      ${html}
      ${botones.length ? `<div class="acciones">${botones.map((b, i) => `<button class="boton ${b.primario ? 'primario' : 'secundario'}" type="button" data-b="${i}" ${b.deshabilitado ? 'disabled' : ''}>${b.texto}</button>`).join('')}</div>` : ''}
    `;
    botones.forEach((b, i) => p.querySelector(`[data-b="${i}"]`).addEventListener('click', () => b.accion?.(p)));
    this.paneles.appendChild(p);
    (p.querySelector('.boton.primario') || p.querySelector('button'))?.focus({ preventScroll: true });
    return p;
  },
  cerrarPanel() { this.paneles.innerHTML = ''; }
};
