/* Escalado responsivo: el lienzo mantiene 16:9 y la capa DOM lo acompaña */
function ajustarEscala() {
  const s = Math.min(window.innerWidth / CONFIG.ancho, window.innerHeight / CONFIG.alto);
  escena.style.width = `${Math.floor(CONFIG.ancho * s)}px`;
  escena.style.height = `${Math.floor(CONFIG.alto * s)}px`;
  Entrada.escala = s;
}
window.addEventListener('resize', ajustarEscala);
ajustarEscala();

/* ============================================================================
   ESCENARIO · el Valle de la Bruma dibujado por código. La claridad k (0..1)
   es el lenguaje visual de la emoción: menos bruma, algo más de color y de
   movimiento. Nunca llega a ser brillante: llega a ser sereno.
   ========================================================================== */
const Motas = {
  lista: [],
  crear() { return { x: Math.random() * CONFIG.ancho, y: Math.random() * CONFIG.alto, vx: (Math.random() - 0.5) * 8, vy: -2 - Math.random() * 5, r: 2 + Math.random() * 3, fase: Math.random() * Math.PI * 2, vida: 0, max: 8 + Math.random() * 8 }; },
  update(dt, k) {
    const factor = GameState.bajaEstimulacion ? CONFIG.bajaEstimulacionFactor : 1;
    const objetivo = Math.round((20 + CONFIG.particulasMaximo * (1 - k)) * factor);
    while (this.lista.length < objetivo) this.lista.push(this.crear());
    if (this.lista.length > objetivo) this.lista.length = objetivo;
    const vel = REDUCIR_MOVIMIENTO ? 0.3 : 0.5 + k * 0.6;
    for (const p of this.lista) {
      p.vida += dt; p.x += p.vx * vel * dt; p.y += p.vy * vel * dt;
      if (p.vida > p.max || p.y < -10) Object.assign(p, this.crear(), { y: CONFIG.alto + 10 });
    }
  },
  dibujar(ctx, k) {
    ctx.save();
    for (const p of this.lista) {
      const a = (0.35 + 0.35 * Math.sin(p.vida * 0.9 + p.fase)) * (0.5 - 0.2 * k) * Math.min(1, p.vida);
      ctx.globalAlpha = Math.max(0, a);
      ctx.fillStyle = '#dfe7ea';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
};

const Valle = {
  /* Cielo, colinas y bruma. `modo` añade el río o el sendero. */
  dibujar(ctx, { t, k, modo = 'valle', flujo = 1, casillas = null }) {
    const W = CONFIG.ancho; const H = CONFIG.alto;
    const cielo = ctx.createLinearGradient(0, 0, 0, H);
    cielo.addColorStop(0, mezcla('#3a4950', '#8da2ac', k));
    cielo.addColorStop(0.6, mezcla('#4a5960', '#b5c3c8', k));
    cielo.addColorStop(1, mezcla('#3e4c52', '#9fb3b4', k));
    ctx.fillStyle = cielo; ctx.fillRect(0, 0, W, H);
    // un tenue ámbar en el horizonte cuando la bruma cede (nunca un sol brillante)
    if (k > 0.35) {
      const g = ctx.createRadialGradient(W * 0.68, H * 0.42, 10, W * 0.68, H * 0.42, 420);
      g.addColorStop(0, `rgba(201,160,106,${(k - 0.35) * 0.32})`); g.addColorStop(1, 'rgba(201,160,106,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
    // colinas en tres capas, más lejanas = más desvaídas
    const capas = [
      { base: H * 0.5, amp: 70, freq: 0.0021, color: mezcla('#55656c', '#8f9fa3', k), alfa: 0.6 },
      { base: H * 0.58, amp: 90, freq: 0.0034, color: mezcla('#4a5b60', '#7d918f', k), alfa: 0.8 },
      { base: H * 0.68, amp: 60, freq: 0.0052, color: mezcla('#41525a', '#6c7f69', k), alfa: 1 }
    ];
    capas.forEach((c, i) => {
      ctx.save(); ctx.globalAlpha = c.alfa;
      ctx.fillStyle = c.color; ctx.beginPath(); ctx.moveTo(0, H);
      for (let x = 0; x <= W; x += 16) {
        const y = c.base - Math.abs(Math.sin(x * c.freq + i * 1.7)) * c.amp - Math.sin(x * c.freq * 3.1 + i) * 12;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(W, H); ctx.closePath(); ctx.fill(); ctx.restore();
    });
    // suelo del valle
    ctx.fillStyle = mezcla('#3b4a4d', '#6f8270', k);
    ctx.fillRect(0, H * 0.72, W, H * 0.28);
    if (modo === 'rio') this.rio(ctx, t, k, flujo);
    if (modo === 'sendero') this.sendero(ctx, t, k, casillas);
    // árboles desnudos, esbozados, que se tiñen de musgo con la claridad
    for (let i = 0; i < 9; i += 1) {
      const x = 60 + ruido(i) * (W - 120); const y = H * 0.66 + ruido(i + 40) * 40; const h = 50 + ruido(i + 80) * 70;
      ctx.strokeStyle = mezcla('#2f3c42', '#5a6b58', k); ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - h); ctx.moveTo(x, y - h * 0.55); ctx.lineTo(x - 18, y - h * 0.8);
      ctx.moveTo(x, y - h * 0.4); ctx.lineTo(x + 16, y - h * 0.7); ctx.stroke();
      if (k > 0.5) { ctx.fillStyle = `rgba(108,127,105,${(k - 0.5) * 0.9})`; ctx.beginPath(); ctx.arc(x, y - h * 0.8, 14 + ruido(i + 3) * 10, 0, Math.PI * 2); ctx.fill(); }
    }
  },
  rio(ctx, t, k, flujo) {
    const W = CONFIG.ancho; const y0 = CONFIG.alto * 0.62; const y1 = CONFIG.alto * 0.82;
    ctx.fillStyle = mezcla('#4d5f68', '#6e8a99', k);
    ctx.beginPath(); ctx.moveTo(0, y0 + 20); ctx.quadraticCurveTo(W * 0.5, y0 - 30, W, y0 + 10); ctx.lineTo(W, y1); ctx.quadraticCurveTo(W * 0.5, y1 + 30, 0, y1 - 20); ctx.closePath(); ctx.fill();
    // brillos que avanzan río abajo; con el río estancado (flujo 0) se quedan quietos y se apagan
    ctx.save(); ctx.globalAlpha = 0.28 + 0.25 * k;
    ctx.strokeStyle = mezcla('#8fa2ab', '#d8e3e6', k); ctx.lineWidth = 2;
    for (let i = 0; i < 14; i += 1) {
      const vel = (REDUCIR_MOVIMIENTO ? 12 : 26) * flujo;
      const x = ((ruido(i) * W + t * vel * (0.6 + ruido(i + 9))) % (W + 80)) - 40;
      const y = lerp(y0 + 30, y1 - 30, ruido(i + 20)) + Math.sin(t * 0.7 + i) * 3;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 24, y - 3, x + 48, y); ctx.stroke();
    }
    ctx.restore();
    if (flujo < 0.5) { // el estancamiento se nota: una lámina opaca sobre el agua
      ctx.fillStyle = `rgba(120,132,138,${(0.5 - flujo) * 0.5})`; ctx.fillRect(0, y0 - 10, W, y1 - y0 + 30);
    }
  },
  /* Sendero de casillas hacia la salida del valle. Cada casilla despejada
     devuelve un elemento de color de baja saturación. */
  sendero(ctx, t, k, casillas) {
    if (!casillas) return;
    const { total, actual } = casillas;
    for (let i = 0; i <= total; i += 1) {
      const p = this.posCasilla(i, total);
      const despejada = i <= actual;
      ctx.fillStyle = despejada ? mezcla('#7c8b8f', '#c9c2b0', 0.4 + 0.6 * k) : 'rgba(110,122,127,0.5)';
      ctx.beginPath(); ctx.ellipse(p.x, p.y, 34, 16, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(31,44,52,0.35)'; ctx.lineWidth = 2; ctx.stroke();
      if (i > 0 && despejada) this.adornoCasilla(ctx, i, p, t);
      if (i === total) { // salida del valle: una abertura suave en la bruma
        const g = ctx.createRadialGradient(p.x, p.y - 40, 6, p.x, p.y - 40, 120);
        g.addColorStop(0, `rgba(226,214,190,${0.25 + 0.4 * k})`); g.addColorStop(1, 'rgba(226,214,190,0)');
        ctx.fillStyle = g; ctx.fillRect(p.x - 120, p.y - 160, 240, 240);
      }
    }
  },
  posCasilla(i, total) {
    const u = i / total;
    return { x: lerp(150, CONFIG.ancho - 170, u), y: lerp(CONFIG.alto * 0.57, CONFIG.alto * 0.36, u) + Math.sin(u * Math.PI * 2) * 30 };
  },
  /* Un elemento de color por tramo: musgo, terracota, ámbar, azul... siempre apagados */
  adornoCasilla(ctx, i, p, t) {
    const tipo = i % 4;
    if (tipo === 1) { ctx.fillStyle = '#6c7f69'; ctx.beginPath(); ctx.ellipse(p.x + 40, p.y + 6, 18, 8, 0, 0, Math.PI * 2); ctx.fill(); }
    if (tipo === 2) { ctx.fillStyle = '#a8705a'; ctx.beginPath(); ctx.moveTo(p.x - 48, p.y + 8); ctx.lineTo(p.x - 36, p.y - 14); ctx.lineTo(p.x - 22, p.y + 8); ctx.closePath(); ctx.fill(); }
    if (tipo === 3) { ctx.fillStyle = '#b9935f'; ctx.beginPath(); ctx.arc(p.x + 30, p.y - 30, 6 + Math.sin(t * 0.8 + i) * 1.5, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = '#7a6244'; ctx.beginPath(); ctx.moveTo(p.x + 30, p.y - 24); ctx.lineTo(p.x + 30, p.y + 6); ctx.stroke(); }
    if (tipo === 0) { ctx.fillStyle = '#5b7787'; ctx.beginPath(); ctx.ellipse(p.x - 30, p.y + 10, 14, 5, 0, 0, Math.PI * 2); ctx.fill(); }
  },
  /* Bruma: bancos de niebla lentos + un velo general. Densidad = 1 - k */
  bruma(ctx, t, k) {
    const W = CONFIG.ancho; const H = CONFIG.alto; const densidad = 1 - k;
    const factor = GameState.bajaEstimulacion ? 0.5 : 1;
    ctx.save();
    for (let i = 0; i < 10; i += 1) {
      const vel = REDUCIR_MOVIMIENTO ? 3 : 7;
      const x = ((ruido(i + 200) * (W + 500) + t * vel * (0.5 + ruido(i + 300))) % (W + 500)) - 250;
      const y = H * (0.35 + ruido(i + 400) * 0.5);
      const r = 180 + ruido(i + 500) * 160;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `rgba(199,209,214,${(0.16 + 0.34 * densidad) * factor})`); g.addColorStop(1, 'rgba(199,209,214,0)');
      ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }
    ctx.fillStyle = `rgba(199,209,214,${0.08 + 0.4 * densidad})`; ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
};

/* Personaje: una figura sencilla con bufanda. Se mueve despacio. */
function dibujarPersonaje(ctx, x, y, { t = 0, k = 0, escala = 1 } = {}) {
  ctx.save(); ctx.translate(x, y); ctx.scale(escala, escala);
  const balanceo = REDUCIR_MOVIMIENTO ? 0 : Math.sin(t * 0.9) * 1.5;
  ctx.fillStyle = mezcla('#2c3940', '#3f505a', k);
  ctx.beginPath(); ctx.roundRect(-16, -70 + balanceo, 32, 58, 10); ctx.fill();   // cuerpo
  ctx.fillStyle = mezcla('#c9b8a2', '#dbc9b0', k);
  ctx.beginPath(); ctx.arc(0, -86 + balanceo, 15, 0, Math.PI * 2); ctx.fill();    // cabeza
  ctx.fillStyle = mezcla('#7d6a5a', '#a8705a', k);
  ctx.beginPath(); ctx.roundRect(-18, -74 + balanceo, 36, 9, 4); ctx.fill();      // bufanda
  ctx.fillStyle = 'rgba(31,44,52,0.35)'; ctx.beginPath(); ctx.ellipse(0, 0, 22, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

/* Barco de papel con la frase: se mece, se aleja o vuelve */
function dibujarBarco(ctx, x, y, t, escala = 1) {
  ctx.save(); ctx.translate(x, y + Math.sin(t * 1.3) * 3); ctx.scale(escala, escala); ctx.rotate(Math.sin(t * 0.9) * 0.04);
  ctx.fillStyle = '#edf2f4'; ctx.strokeStyle = 'rgba(31,44,52,0.45)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-46, 0); ctx.lineTo(46, 0); ctx.lineTo(30, 18); ctx.lineTo(-30, 18); ctx.closePath(); ctx.fill(); ctx.stroke(); // casco
  ctx.beginPath(); ctx.moveTo(-22, 0); ctx.lineTo(0, -30); ctx.lineTo(22, 0); ctx.closePath(); ctx.fill(); ctx.stroke();               // vela
  ctx.fillStyle = 'rgba(91,119,135,0.35)'; ctx.beginPath(); ctx.ellipse(0, 22, 50, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

/* ============================================================================
   MÁQUINA DE ESTADOS · MENU_ESTRATEGIA → MINIJUEGO_RIO | MINIJUEGO_SENDERO →
   CAJA_HERRAMIENTAS → REEVALUACION → FEEDBACK
   ========================================================================== */
const Maquina = {
  estados: {},
  actual: null,
  nombre: null,
  cambiar(nombre) {
    this.actual?.salir?.();
    Hud.cerrarPanel(); Hud.decir(null); capaJuego.innerHTML = '';
    this.nombre = nombre; GameState.estado = nombre;
    this.actual = this.estados[nombre];
    this.actual.t = 0;
    this.actual.entrar();
  }
};

/* --------------------------------------------------------- MENU_ESTRATEGIA */
Maquina.estados.MENU_ESTRATEGIA = {
  t: 0, seleccion: null,
  entrar() {
    Claridad.fijar(0.08);
    Hud.setFases(null); Hud.setEnergia(null);
    Fases.iniciar('MENU_ESTRATEGIA');
    this.seleccion = GameState.estrategiaSugerida;
    this.pintarPanel();
  },
  pintarPanel() {
    const tarjeta = (e) => `
      <button class="tarjeta ${this.seleccion === e.id ? 'seleccionada' : ''}" type="button" data-estrategia="${e.id}" aria-pressed="${this.seleccion === e.id}">
        ${e.id === GameState.estrategiaSugerida ? '<span class="etiqueta">Estrategia sugerida</span>' : ''}
        <strong>${e.camino}</strong>
        <em>${e.nombre}</em>
        <span>${e.descripcion}</span>
        <small>${e.fases.join(' → ')}</small>
      </button>`;
    const p = Hud.panel({
      eyebrow: 'El Valle de la Bruma · Isla de la Tristeza',
      titulo: 'Elige una forma de acompañarla',
      clase: 'ancho',
      html: `
        <p class="cita">“${TEXTOS.entrada}”</p>
        <div class="intensidad" role="group" aria-label="Intensidad de la tristeza con la que llegas">
          <span>Intensidad que identificaste:</span>
          ${['BAJA', 'MEDIA', 'ALTA'].map((n) => `<button type="button" data-intensidad="${n}" aria-pressed="${GameState.intensidadInicial === n}">${n}</button>`).join('')}
        </div>
        <div class="tarjetas">${tarjeta(ESTRATEGIAS.rio)}${tarjeta(ESTRATEGIAS.sendero)}</div>
        <p class="aviso" data-aviso ${this.seleccion === GameState.estrategiaSugerida ? 'hidden' : ''}>${TEXTOS.otraEstrategia}</p>
      `,
      botones: [
        { texto: TEXTOS.btnContinuar, primario: true, accion: () => this.continuar() },
        { texto: TEXTOS.btnOtra, accion: () => this.verOtra() }
      ]
    });
    p.querySelectorAll('[data-estrategia]').forEach((b) => b.addEventListener('click', () => this.seleccionar(b.dataset.estrategia)));
    p.querySelectorAll('[data-intensidad]').forEach((b) => b.addEventListener('click', () => this.fijarIntensidad(b.dataset.intensidad)));
  },
  fijarIntensidad(n) {
    GameState.intensidadInicial = n;
    GameState.estrategiaSugerida = CONFIG.sugeridaPorIntensidad[n];
    window.sessionLog.intensidadInicial = n;
    window.sessionLog.estrategiaSugerida = GameState.estrategiaSugerida;
    this.seleccion = GameState.estrategiaSugerida;
    Audio.suavecito();
    this.pintarPanel();
  },
  seleccionar(id) {
    this.seleccion = id;
    const p = Hud.paneles.querySelector('.panel');
    p.querySelectorAll('[data-estrategia]').forEach((b) => { const on = b.dataset.estrategia === id; b.classList.toggle('seleccionada', on); b.setAttribute('aria-pressed', String(on)); });
    // elegir una estrategia distinta a la sugerida no resta nada: solo se informa
    p.querySelector('[data-aviso]').hidden = id === GameState.estrategiaSugerida;
    Audio.suavecito();
  },
  verOtra() {
    const otra = this.seleccion === 'rio' ? 'sendero' : 'rio';
    this.seleccionar(otra);
    Hud.paneles.querySelector(`[data-estrategia="${otra}"]`)?.focus({ preventScroll: true });
  },
  continuar() {
    const e = ESTRATEGIAS[this.seleccion];
    GameState.estrategiaElegida = e.id;
    window.sessionLog.estrategiaElegida = e.id;
    window.sessionLog.minijuego = e.camino;
    Audio.pling();
    Maquina.cambiar(e.estado);
  },
  update(dt) { this.t += dt; Motas.update(dt, GameState.claridad); },
  render(ctx) {
    const k = GameState.claridad;
    Valle.dibujar(ctx, { t: this.t, k, modo: 'valle' });
    dibujarPersonaje(ctx, 250, 560, { t: this.t, k });
    Motas.dibujar(ctx, k); Valle.bruma(ctx, this.t, k);
  }
};

/* ============================================================================
   MINIJUEGO_RIO · "El río de las palabras" · SENTIR → NOMBRAR → NARRAR → SOLTAR
   Etiquetado afectivo (Lieberman et al., 2007), escritura expresiva
   (Pennebaker & Beall, 1986) y rumia vs. reflexión (Nolen-Hoeksema, 1991; 2008)
   ========================================================================== */

/* El nudo de bruma: partículas lentas y amorfas que, con cada palabra,
   se ordenan en un anillo y toman un tenue color. */
const Nudo = {
  centro: { x: 640, y: 320 }, lista: [], forma: 0, tinte: 0,
  colores: ['#5b7787', '#6c7f69', '#b9935f'],
  crear() {
    this.lista = Array.from({ length: 70 }, (_, i) => ({
      a: Math.random() * Math.PI * 2, r: 30 + Math.random() * 120, r0: 0, vel: (0.05 + Math.random() * 0.12) * (Math.random() < 0.5 ? 1 : -1),
      tam: 10 + Math.random() * 26, fase: i * 0.37, orden: Math.random()
    }));
    this.forma = 0; this.tinte = 0;
  },
  update(dt) {
    const lento = REDUCIR_MOVIMIENTO ? 0.4 : 1;
    for (const p of this.lista) {
      p.a += p.vel * dt * lento * (1 - this.forma * 0.5);
      // las partículas cuya "orden" queda por debajo de forma se estabilizan en un anillo
      const objetivo = p.orden < this.forma ? 95 : p.r0 || (p.r0 = p.r);
      p.r = lerp(p.r, objetivo, 1 - Math.exp(-dt * 0.8));
    }
  },
  dibujar(ctx, t) {
    ctx.save();
    for (const p of this.lista) {
      const ordenada = p.orden < this.forma;
      const x = this.centro.x + Math.cos(p.a) * p.r * 1.3 + Math.sin(t * 0.5 + p.fase) * 6;
      const y = this.centro.y + Math.sin(p.a) * p.r * 0.75 + Math.cos(t * 0.4 + p.fase) * 5;
      const idx = Math.min(this.colores.length - 1, Math.floor(p.orden * this.colores.length));
      const color = ordenada ? mezcla('#aab7be', this.colores[idx], 0.55) : 'rgba(170,183,190,1)';
      const g = ctx.createRadialGradient(x, y, 0, x, y, p.tam);
      g.addColorStop(0, color.replace(/,1\)$/, `,${ordenada ? 0.55 : 0.4})`)); g.addColorStop(1, 'rgba(170,183,190,0)');
      ctx.fillStyle = g; ctx.fillRect(x - p.tam, y - p.tam, p.tam * 2, p.tam * 2);
    }
    ctx.restore();
  }
};

/* Regla explícita de rumia vs. reflexión (Nolen-Hoeksema): releer la frase en
   bucle es rumia; elegir qué hacer con ella es reflexión. */
const Rumia = {
  seguidas: 0,
  releer() {
    this.seguidas += 1;
    window.sessionLog.vecesQueReleyo += 1;
    return this.seguidas >= CONFIG.rio.umbralRumia && this.seguidas % CONFIG.rio.umbralRumia === 0;
  },
  reflexionar() { this.seguidas = 0; }
};

Maquina.estados.MINIJUEGO_RIO = {
  t: 0, fase: 'SENTIR', flujo: 1, flujoObjetivo: 1,
  palabras: [], frase: null, barco: null,
  entrar() {
    Claridad.fijar(0.05);
    Hud.setEnergia(null);
    this.palabras = []; this.frase = null; this.barco = null;
    this.flujo = 1; this.flujoObjetivo = 1; Rumia.seguidas = 0;
    Nudo.crear();
    this.irA('SENTIR');
  },
  salir() { Fases.cerrar(); },
  irA(fase) {
    this.fase = fase;
    Hud.setFases(ESTRATEGIAS.rio.fases, fase);
    Fases.iniciar(`RIO_${fase}`);
    Hud.cerrarPanel(); capaJuego.innerHTML = ''; Hud.decir(null);
    this[`fase${fase}`]();
  },

  /* ---- SENTIR: la masa gris sin nombre. Solo un botón. ---- */
  faseSENTIR() {
    Hud.panel({
      eyebrow: 'La orilla del río de bruma · SENTIR',
      titulo: 'El nudo de bruma',
      clase: 'abajo translucido',
      html: `<p class="clinico">${TEXTOS.sentir}</p><p class="nota">Cuando quieras, y solo entonces, empieza. Aquí no hay reloj.</p>`,
      botones: [{ texto: 'EMPEZAR', primario: true, accion: () => this.irA('NOMBRAR') }]
    });
  },

  /* ---- NOMBRAR: fichas de matiz que se arrastran al cuenco ---- */
  faseNOMBRAR() {
    capaJuego.innerHTML = `
      <div id="fichas" aria-label="Fichas de palabra"></div>
      <div id="cuenco" aria-live="polite">
        <span class="titulo">Cuenco de palabras · hasta ${CONFIG.rio.maximoPalabras}</span>
        <div class="slots" data-slots><span class="vacio">Arrastra o toca una ficha para dejarla aquí.</span></div>
        <div class="acciones"><button class="boton primario" type="button" data-continuar disabled>Continuar</button></div>
      </div>`;
    const contFichas = capaJuego.querySelector('#fichas');
    const cuenco = capaJuego.querySelector('#cuenco');
    const slots = cuenco.querySelector('[data-slots]');
    const btnContinuar = cuenco.querySelector('[data-continuar]');
    this.fichas = [];
    const compacto = () => window.innerWidth <= 860;     // mismo umbral que el CSS: fichas en filas

    const palabras = barajar(PALABRAS).slice(0, CONFIG.rio.fichasEnPantalla);
    palabras.forEach((palabra, i) => {
      const f = document.createElement('button');
      f.type = 'button'; f.className = 'ficha'; f.textContent = palabra;
      f.setAttribute('aria-label', `${palabra}. Enter para dejarla en el cuenco`);
      // se desprenden del nudo y flotan despacio dentro de una zona alrededor de él
      const ang = (i / palabras.length) * Math.PI * 2;
      const dato = { el: f, x: 640 + Math.cos(ang) * 60, y: 320 + Math.sin(ang) * 40, ox: 640 + Math.cos(ang) * (250 + ruido(i) * 220), oy: 300 + Math.sin(ang) * (150 + ruido(i + 5) * 70), fase: i * 0.7, colocada: false, arrastrando: false, ignorarClick: false };
      this.fichas.push(dato);
      // el click que sigue a un arrastre soltado fuera del cuenco no debe colocarla
      f.addEventListener('click', () => { if (dato.ignorarClick) return; if (!dato.arrastrando && !dato.colocada) this.colocarFicha(dato); });
      f.addEventListener('pointerdown', (e) => this.iniciarArrastre(dato, e));
      contFichas.appendChild(f);
    });

    this.colocarFicha = (dato) => {
      if (this.palabras.length >= CONFIG.rio.maximoPalabras) { Hud.decir(`Puedes elegir hasta ${CONFIG.rio.maximoPalabras} palabras. Toca una del cuenco para devolverla.`, { arriba: true }); return; }
      dato.colocada = true; dato.el.classList.remove('arrastrando'); dato.el.classList.add('colocada');
      dato.el.setAttribute('aria-label', `${dato.el.textContent}. Enter para devolverla`);
      dato.el.style.removeProperty('--x'); dato.el.style.removeProperty('--y');
      slots.querySelector('.vacio')?.remove(); slots.appendChild(dato.el);
      this.palabras.push(dato.el.textContent);
      window.sessionLog.palabrasElegidas = [...this.palabras];
      Nudo.forma = Math.min(1, this.palabras.length * (1 / CONFIG.rio.maximoPalabras));
      Claridad.sumar(CONFIG.rio.claridadPorPalabra);
      Audio.gota();
      if (this.palabras.length === 1) Hud.decir(TEXTOS.primeraFicha, { ms: 6000, suave: true, arriba: true });
      btnContinuar.disabled = false;
    };
    this.devolverFicha = (dato) => {
      dato.colocada = false; dato.el.classList.remove('colocada');
      dato.el.setAttribute('aria-label', `${dato.el.textContent}. Enter para dejarla en el cuenco`);
      contFichas.appendChild(dato.el);
      this.palabras = this.palabras.filter((p) => p !== dato.el.textContent);
      window.sessionLog.palabrasElegidas = [...this.palabras];
      Nudo.forma = this.palabras.length / CONFIG.rio.maximoPalabras;
      Claridad.sumar(-CONFIG.rio.claridadPorPalabra);
      if (!slots.querySelector('.ficha')) slots.innerHTML = '<span class="vacio">Arrastra o toca una ficha para dejarla aquí.</span>';
      btnContinuar.disabled = this.palabras.length === 0;
      Audio.suavecito();
    };
    // clic en una ficha ya colocada la devuelve
    slots.addEventListener('click', (e) => { const f = e.target.closest('.ficha'); if (!f) return; const dato = this.fichas.find((d) => d.el === f); if (dato) this.devolverFicha(dato); });

    this.iniciarArrastre = (dato, e) => {
      if (dato.colocada || compacto()) return;      // en modo compacto basta con tocar
      e.preventDefault();
      dato.arrastrando = true; dato.el.classList.add('arrastrando');
      try { dato.el.setPointerCapture(e.pointerId); } catch { /* opcional */ }
      const origen = { x: e.clientX, y: e.clientY }; let movio = false;
      const mover = (ev) => {
        if (Math.hypot(ev.clientX - origen.x, ev.clientY - origen.y) > 6) movio = true;
        const p = Entrada.aLienzo(ev); dato.x = p.x; dato.y = p.y; cuenco.classList.toggle('sobre', this.sobreCuenco(ev));
      };
      const soltar = (ev) => {
        dato.el.removeEventListener('pointermove', mover); dato.el.removeEventListener('pointerup', soltar); dato.el.removeEventListener('pointercancel', soltar);
        const dentro = this.sobreCuenco(ev); cuenco.classList.remove('sobre');
        dato.arrastrando = false; dato.el.classList.remove('arrastrando');
        if (movio) { dato.ignorarClick = true; setTimeout(() => { dato.ignorarClick = false; }, 0); }
        if (dentro) this.colocarFicha(dato); else { dato.ox = dato.x; dato.oy = dato.y; }
      };
      dato.el.addEventListener('pointermove', mover); dato.el.addEventListener('pointerup', soltar); dato.el.addEventListener('pointercancel', soltar);
    };
    this.sobreCuenco = (ev) => { const r = cuenco.getBoundingClientRect(); return ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom; };
    btnContinuar.addEventListener('click', () => this.irA('NARRAR'));
    // flechas: mover el foco entre fichas
    contFichas.addEventListener('keydown', (e) => {
      if (!['ArrowRight', 'ArrowLeft'].includes(e.key)) return;
      const lista = [...contFichas.querySelectorAll('.ficha')]; const i = lista.indexOf(document.activeElement); if (i < 0) return;
      e.preventDefault(); lista[(i + (e.key === 'ArrowRight' ? 1 : lista.length - 1)) % lista.length].focus();
    });
    contFichas.querySelector('.ficha')?.focus({ preventScroll: true });
  },
  actualizarFichas(dt) {
    if (!this.fichas || this.fase !== 'NOMBRAR') return;
    const lento = REDUCIR_MOVIMIENTO ? 0.15 : 1;
    const r = lienzo.getBoundingClientRect();     // las fichas viven en la ventana, pero se colocan sobre el lienzo
    for (const d of this.fichas) {
      if (d.colocada) continue;
      if (!d.arrastrando) {
        // se acercan a su lugar de flotación y ondulan despacio
        const dx = d.ox + Math.sin(this.t * 0.35 + d.fase) * 14 * lento - d.x; const dy = d.oy + Math.cos(this.t * 0.3 + d.fase) * 9 * lento - d.y;
        d.x += dx * (1 - Math.exp(-dt * 0.9)); d.y += dy * (1 - Math.exp(-dt * 0.9));
      }
      d.el.style.setProperty('--x', `${r.left + (d.x / CONFIG.ancho) * r.width}px`); d.el.style.setProperty('--y', `${r.top + (d.y / CONFIG.alto) * r.height}px`);
    }
  },

  /* ---- NARRAR: plantilla con huecos y banco de fragmentos ---- */
  faseNARRAR() {
    const hueco1 = this.palabras.length > 1 ? `${this.palabras.slice(0, -1).join(', ')} y ${this.palabras.at(-1)}` : this.palabras[0];
    this.huecos = { 2: null, 3: null };
    this.usoLibre = false;
    const p = Hud.panel({
      eyebrow: 'La orilla del río de bruma · NARRAR',
      titulo: 'Construye la frase',
      clase: 'ancho translucido',
      html: `
        <p>Toca o arrastra un fragmento a cada hueco. Puedes rehacerla las veces que quieras: no hay frase correcta.</p>
        <div class="plantilla" aria-label="Plantilla de la frase">
          <span>Me siento</span><span class="hueco fijo" aria-label="Palabras elegidas">${escapar(hueco1)}</span>
          <span>porque</span><span class="unidad"><button class="hueco" type="button" data-hueco="2" aria-label="Hueco: porque">______</button>.</span>
          <span>Y lo que más me cuesta de esto es</span><span class="unidad"><button class="hueco" type="button" data-hueco="3" aria-label="Hueco: lo que más me cuesta">______</button>.</span>
        </div>
        <div class="banco" data-banco aria-label="Banco de fragmentos">
          ${FRAGMENTOS.map((f, i) => `<button class="fragmento" type="button" data-frag="${i}">${f}</button>`).join('')}
          <button class="fragmento comodin" type="button" data-comodin>[escribir lo mío]</button>
        </div>
        <div class="libre" data-libre hidden>
          <input type="text" maxlength="${CONFIG.rio.textoLibreMax}" placeholder="Escribe con tus palabras…" aria-label="Texto libre" />
          <button class="boton" type="button" data-usar-libre>Usar</button>
          <small>Máximo ${CONFIG.rio.textoLibreMax} caracteres. Esto no se envía a ningún lado: se queda solo en tu sesión.</small>
        </div>`,
      botones: [
        { texto: 'Continuar', primario: true, deshabilitado: true, accion: () => this.irA('SOLTAR') },
        { texto: 'Volver a las palabras', accion: () => this.irA('NOMBRAR') }
      ]
    });
    const btnContinuar = p.querySelector('.boton.primario');
    const huecos = [...p.querySelectorAll('[data-hueco]')];
    const banco = p.querySelector('[data-banco]');
    const libre = p.querySelector('[data-libre]');
    let huecoActivo = null;

    const rellenar = (n, texto) => {
      this.huecos[n] = texto;
      const h = huecos.find((x) => x.dataset.hueco === String(n));
      h.textContent = texto; h.classList.add('lleno'); h.setAttribute('aria-label', `Hueco ${n}: ${texto}. Enter para vaciarlo`);
      huecos.forEach((x) => x.classList.remove('activo')); huecoActivo = null;
      banco.querySelectorAll('[data-frag]').forEach((b) => b.classList.toggle('usado', Object.values(this.huecos).includes(b.textContent)));
      btnContinuar.disabled = !(this.huecos[2] && this.huecos[3]);
      Audio.gota();
      this.frase = `Me siento ${hueco1} porque ${this.huecos[2] ?? '…'}. Y lo que más me cuesta de esto es ${this.huecos[3] ?? '…'}.`;
      window.sessionLog.fraseConstruida = this.frase;
    };
    const vaciar = (n) => {
      this.huecos[n] = null;
      const h = huecos.find((x) => x.dataset.hueco === String(n));
      h.textContent = '______'; h.classList.remove('lleno'); h.setAttribute('aria-label', `Hueco ${n}`);
      banco.querySelectorAll('[data-frag]').forEach((b) => b.classList.toggle('usado', Object.values(this.huecos).includes(b.textContent)));
      btnContinuar.disabled = true; Audio.suavecito();
    };
    const siguienteHueco = () => huecoActivo ?? (this.huecos[2] ? (this.huecos[3] ? 2 : 3) : 2);

    huecos.forEach((h) => h.addEventListener('click', () => {
      const n = Number(h.dataset.hueco);
      if (this.huecos[n]) { vaciar(n); return; }
      huecoActivo = n; huecos.forEach((x) => x.classList.toggle('activo', x === h));
    }));
    banco.querySelectorAll('[data-frag]').forEach((b) => {
      b.addEventListener('click', () => rellenar(siguienteHueco(), b.textContent));
      b.addEventListener('pointerdown', (e) => this.arrastrarFragmento(b, e, huecos, (n) => rellenar(n, b.textContent)));
    });
    p.querySelector('[data-comodin]').addEventListener('click', () => { libre.hidden = !libre.hidden; if (!libre.hidden) libre.querySelector('input').focus(); });
    const usarLibre = () => {
      const texto = libre.querySelector('input').value.trim().slice(0, CONFIG.rio.textoLibreMax);
      if (!texto) return;
      this.usoLibre = true; window.sessionLog.usoDeTextoLibre = true;
      rellenar(siguienteHueco(), texto); libre.querySelector('input').value = '';
    };
    p.querySelector('[data-usar-libre]').addEventListener('click', usarLibre);
    libre.querySelector('input').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); usarLibre(); } });
    // flechas dentro del banco
    banco.addEventListener('keydown', (e) => {
      if (!['ArrowRight', 'ArrowLeft'].includes(e.key)) return;
      const lista = [...banco.querySelectorAll('button')]; const i = lista.indexOf(document.activeElement); if (i < 0) return;
      e.preventDefault(); lista[(i + (e.key === 'ArrowRight' ? 1 : lista.length - 1)) % lista.length].focus();
    });
    banco.querySelector('button')?.focus({ preventScroll: true });
  },
  /* Arrastre de un fragmento hasta un hueco (puntero). El clic sigue funcionando. */
  arrastrarFragmento(b, e, huecos, onSoltar) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const inicio = { x: e.clientX, y: e.clientY }; let fantasma = null;
    const mover = (ev) => {
      if (!fantasma) {
        if (Math.hypot(ev.clientX - inicio.x, ev.clientY - inicio.y) < 8) return;
        fantasma = b.cloneNode(true); fantasma.classList.add('arrastrando'); document.body.appendChild(fantasma);
      }
      fantasma.style.left = `${ev.clientX - fantasma.offsetWidth / 2}px`; fantasma.style.top = `${ev.clientY - fantasma.offsetHeight / 2}px`;
      huecos.forEach((h) => { const r = h.getBoundingClientRect(); h.classList.toggle('sobre', ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom); });
    };
    const soltar = () => {
      window.removeEventListener('pointermove', mover); window.removeEventListener('pointerup', soltar); window.removeEventListener('pointercancel', soltar);
      if (!fantasma) return;                                  // fue un clic: lo gestiona el listener de click
      fantasma.remove();
      const destino = huecos.find((h) => h.classList.contains('sobre'));
      huecos.forEach((h) => h.classList.remove('sobre'));
      if (destino) { onSoltar(Number(destino.dataset.hueco)); b.dataset.arrastrado = '1'; setTimeout(() => delete b.dataset.arrastrado, 0); }
    };
    window.addEventListener('pointermove', mover); window.addEventListener('pointerup', soltar); window.addEventListener('pointercancel', soltar);
    // si se arrastró, el click posterior no debe volver a rellenar
    b.addEventListener('click', (ev) => { if (b.dataset.arrastrado) ev.stopImmediatePropagation(); }, { capture: true, once: true });
  },

  /* ---- SOLTAR: el barco de papel y el mecanismo del río ---- */
  faseSOLTAR() {
    this.barco = { x: 640, y: 522, escala: 1, modo: 'quieto', t0: 0, alfa: 1 };
    this.pintarOpcionesBarco();
  },
  pintarOpcionesBarco(prompt = '') {
    Hud.panel({
      eyebrow: 'La orilla del río de bruma · SOLTAR',
      titulo: prompt || 'Tu frase es ahora un barco de papel',
      clase: 'ancho translucido arriba',
      html: `<p class="frase-final">“${escapar(this.frase)}”</p><p class="nota">Elige qué hacer con ella. Cada opción produce algo distinto en el río.</p>`,
      botones: [
        { texto: 'DEJARLA IR', primario: true, accion: () => this.dejarIr() },
        { texto: 'GUARDARLA', accion: () => this.guardar() },
        { texto: 'LEERLA OTRA VEZ', accion: () => this.releer() }
      ]
    });
  },
  dejarIr() {
    // expresión + distanciamiento: el barco se aleja río abajo y la bruma se aclara parcialmente
    Rumia.reflexionar(); this.flujoObjetivo = 1;
    window.sessionLog.accionFinalDelBarco = 'dejar_ir';
    this.barco.modo = 'irse'; this.barco.t0 = this.t;
    Hud.cerrarPanel(); Audio.pling();
    Claridad.sumar(CONFIG.rio.claridadDejarIr);
    setTimeout(() => this.cierre(), CONFIG.rio.duracionDejarIr * 1000 + 300);
  },
  guardar() {
    // registro y reconocimiento: la frase se pliega y entra en la caja; la bruma queda translúcida
    Rumia.reflexionar(); this.flujoObjetivo = 1;
    window.sessionLog.accionFinalDelBarco = 'guardar';
    GameState.registros.push(this.frase);
    this.barco.modo = 'plegar'; this.barco.t0 = this.t;
    Hud.cerrarPanel(); Audio.gota();
    Claridad.sumar(CONFIG.rio.claridadGuardar);
    setTimeout(() => this.cierre(), 1400 * CONFIG.transicion + 300);
  },
  releer() {
    this.barco.modo = 'volver'; this.barco.t0 = this.t; this.barco.x = 640 + 180;
    Audio.suavecito();
    const rumia = Rumia.releer();
    if (rumia) {
      // RAMA DE RUMIA: el río se estanca y la bruma se espesa. Sin castigo: el juego espera.
      window.sessionLog.entroEnRamaDeRumia = true;
      this.flujoObjetivo = 0; Claridad.sumar(-0.08);
      Hud.panel({
        eyebrow: 'El río se estanca',
        titulo: 'Volver sobre lo mismo',
        clase: 'ancho translucido arriba',
        html: `<p class="clinico">${TEXTOS.rumia}</p>`,
        botones: [
          { texto: 'SEGUIR MIRÁNDOLA', accion: () => this.pintarOpcionesBarco('Sigue mirándola el tiempo que necesites') },
          { texto: 'PREGUNTARME QUÉ NECESITO', primario: true, accion: () => { Rumia.reflexionar(); this.flujoObjetivo = 1; Claridad.sumar(0.06); Audio.gota(); this.pintarOpcionesBarco('¿Qué necesitas ahora?'); } }
        ]
      });
      return;
    }
    this.pintarOpcionesBarco('Vuelves a leerla');
  },
  cierre() {
    Hud.setFases(ESTRATEGIAS.rio.fases, 'SOLTAR');
    otorgarHerramienta('farol');
    Hud.panel({
      eyebrow: 'Cierre',
      titulo: 'El río de las palabras',
      html: `<p class="clinico">${TEXTOS.rioCierre}</p>
             <p class="nota">${HERRAMIENTAS.farol.icono} <strong>${HERRAMIENTAS.farol.nombre}</strong> se guarda en tu caja de herramientas.</p>`,
      botones: [{ texto: 'Ir a la caja de herramientas', primario: true, accion: () => Maquina.cambiar('CAJA_HERRAMIENTAS') }]
    });
  },
  update(dt) {
    this.t += dt;
    this.flujo = lerp(this.flujo, this.flujoObjetivo, 1 - Math.exp(-dt * 0.8));
    Nudo.update(dt); Motas.update(dt, GameState.claridad); this.actualizarFichas(dt);
    if (this.barco) {
      const b = this.barco; const e = this.t - b.t0;
      if (b.modo === 'irse') { const p = suave(clamp(e / CONFIG.rio.duracionDejarIr, 0, 1)); b.x = lerp(640, CONFIG.ancho + 80, p); b.escala = lerp(1, 0.5, p); b.alfa = 1 - p * 0.6; }
      if (b.modo === 'volver') { const p = suave(clamp(e / CONFIG.rio.duracionVolver, 0, 1)); b.x = lerp(820, 640, p); b.escala = 1; b.alfa = 1; if (p >= 1) b.modo = 'quieto'; }
      if (b.modo === 'plegar') { const p = suave(clamp(e / (1.4 * CONFIG.transicion), 0, 1)); b.escala = lerp(1, 0.15, p); b.y = lerp(522, 690, p); b.alfa = 1 - p * 0.3; }
    }
  },
  render(ctx) {
    const k = GameState.claridad;
    Valle.dibujar(ctx, { t: this.t, k, modo: 'rio', flujo: this.flujo });
    dibujarPersonaje(ctx, 170, 620, { t: this.t, k, escala: 0.9 });
    if (this.fase === 'SENTIR' || this.fase === 'NOMBRAR') Nudo.dibujar(ctx, this.t);
    if (this.barco) { ctx.save(); ctx.globalAlpha = this.barco.alfa; dibujarBarco(ctx, this.barco.x, this.barco.y, this.t, this.barco.escala); ctx.restore(); }
    Motas.dibujar(ctx, k); Valle.bruma(ctx, this.t, k);
  }
};

/* ============================================================================
   MINIJUEGO_SENDERO · "El sendero de los pasos pequeños"
   DETECTAR → ELEGIR → ACTUAR → REGISTRAR
   Activación conductual (Lewinsohn, 1974; Martell, Dimidjian & Herman-Dunn,
   2010): la acción precede a la motivación; la energía se recupera al actuar.
   Conservación de energía como función adaptativa de la tristeza (Nesse, 2000).
   ========================================================================== */
Maquina.estados.MINIJUEGO_SENDERO = {
  t: 0, fase: 'DETECTAR', energia: 0, casilla: 0, turno: 0, racha: 0, mazo: [], descarte: [], mano: [], historial: [], personaje: { x: 0, y: 0 },
  entrar() {
    Claridad.fijar(0.05);
    this.energia = CONFIG.sendero.energiaInicial; this.casilla = 0; this.turno = 0; this.racha = 0;
    this.mazo = barajar(MAZO); this.descarte = []; this.mano = []; this.historial = [];
    const p0 = Valle.posCasilla(0, CONFIG.sendero.casillas); this.personaje = { x: p0.x, y: p0.y };
    this.irA('DETECTAR');
  },
  salir() { Fases.cerrar(); Hud.setEnergia(null); },
  irA(fase) {
    this.fase = fase;
    Hud.setFases(ESTRATEGIAS.sendero.fases, fase);
    Fases.iniciar(`SENDERO_${fase}`);
    Hud.cerrarPanel(); Hud.decir(null);
    this[`fase${fase}`]();
  },

  /* ---- DETECTAR: el estado inicial y el principio ---- */
  faseDETECTAR() {
    Hud.setEnergia(this.energia, 0);
    Hud.panel({
      eyebrow: 'El sendero cubierto de bruma · DETECTAR',
      titulo: `Energía disponible: ${this.energia} de ${CONFIG.sendero.energiaMaxima}`,
      clase: 'ancho translucido abajo',
      html: `<p class="clinico">${TEXTOS.senderoEntrada}</p>
             <p class="nota">Aquí la energía <strong>no se gasta</strong> al actuar: se recupera. Cada carta despeja un tramo del sendero. DESCANSAR está siempre disponible y nunca resta.</p>`,
      botones: [{ texto: 'EMPEZAR', primario: true, accion: () => this.irA('ELEGIR') }]
    });
  },

  /* ---- ELEGIR: la mano de cartas ---- */
  robar() {
    while (this.mano.length < CONFIG.sendero.manoTamano) {
      if (!this.mazo.length) { this.mazo = barajar(this.descarte); this.descarte = []; if (!this.mazo.length) break; }
      this.mano.push(this.mazo.pop());
    }
  },
  faseELEGIR() {
    this.robar();
    this.turno += 1;
    capaJuego.innerHTML = `
      <div id="mesa">
        <div class="fila">
          <span class="turno">Turno ${this.turno} · casilla ${this.casilla} de ${CONFIG.sendero.casillas}</span>
          <button class="boton secundario" id="terminar" type="button" ${this.turno >= CONFIG.sendero.turnoTerminar ? '' : 'hidden'}>TERMINAR AQUÍ</button>
        </div>
        <div id="mano" aria-label="Cartas de acción"></div>
      </div>`;
    const mano = capaJuego.querySelector('#mano');
    const pintarCarta = (c, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = `carta ${c.categoria}`; b.dataset.i = String(i);
      const efecto = c.categoria === 'descanso' ? `+${CONFIG.sendero.descanso} energía · no avanza` : `${this.previsualizar(c)}`;
      b.innerHTML = `<span class="categoria">${c.titulo}</span><strong>${c.nombre}</strong>
        <span class="esfuerzo">${c.esfuerzo ? `Esfuerzo: ${'💧'.repeat(c.esfuerzo)}` : 'Sin coste'}</span><span class="efecto">${efecto}</span>`;
      b.setAttribute('aria-label', `${c.nombre}. ${c.titulo}. ${c.esfuerzo ? `Esfuerzo ${c.esfuerzo}` : 'Sin coste'}. ${efecto}`);
      b.addEventListener('click', () => this.jugar(c));
      mano.appendChild(b);
    };
    this.mano.forEach(pintarCarta);
    pintarCarta(CARTA_DESCANSAR, -1);
    capaJuego.querySelector('#terminar').addEventListener('click', () => this.terminar(true));
    mano.addEventListener('keydown', (e) => {
      if (!['ArrowRight', 'ArrowLeft'].includes(e.key)) return;
      const lista = [...mano.querySelectorAll('.carta')]; const i = lista.indexOf(document.activeElement); if (i < 0) return;
      e.preventDefault(); lista[(i + (e.key === 'ArrowRight' ? 1 : lista.length - 1)) % lista.length].focus();
    });
    mano.querySelector('.carta')?.focus({ preventScroll: true });
    Hud.setEnergia(this.energia, this.racha);
  },
  /* Cuánta energía devolvería la carta ahora mismo (se muestra en la carta) */
  calcularEfecto(c) {
    const cfg = CONFIG.sendero;
    if (c.esfuerzo === 0) return { energia: cfg.descanso, aMedias: false, racha: this.racha };
    if (c.esfuerzo === 3 && this.energia < cfg.umbralEnergiaBaja) return { energia: cfg.efectoAMedias, aMedias: true, racha: 0 };
    if (c.esfuerzo === 3) return { energia: cfg.efectoBase[3], aMedias: false, racha: 0 };
    // pasos pequeños encadenados: cada uno rinde más que el anterior
    const racha = Math.min(cfg.rachaMaxima, this.racha + 1);
    return { energia: cfg.efectoBase[c.esfuerzo] + (racha - 1) * cfg.bonusRacha, aMedias: false, racha };
  },
  previsualizar(c) {
    const r = this.calcularEfecto(c);
    return r.aMedias ? `Con poca energía saldría a medias: +${r.energia}` : `+${r.energia} energía${r.racha > 1 ? ` (racha ×${r.racha})` : ''} · avanza 1`;
  },

  /* ---- ACTUAR: la regla de oro del balance ---- */
  jugar(c) {
    this.irAFaseSinPanel('ACTUAR');
    const cfg = CONFIG.sendero;
    const r = this.calcularEfecto(c);
    const antes = this.energia;
    this.energia = clamp(this.energia + r.energia, 0, cfg.energiaMaxima);
    this.racha = r.racha;
    const log = window.sessionLog;
    log.turnosTotales = this.turno;
    log.cartasJugadas.push(c.nombre);
    log.secuenciaDeEsfuerzo.push(c.esfuerzo);
    log.energiaPorTurno.push(Math.round(this.energia));
    this.historial.push({ turno: this.turno, carta: c, gano: this.energia - antes, energia: Math.round(this.energia), aMedias: r.aMedias });

    if (c.esfuerzo === 0) {
      log.vecesQueDescanso += 1;
      Hud.decir(TEXTOS.descansar, { ms: 6000, suave: true });
      Audio.suavecito();
    } else {
      this.mano = this.mano.filter((x) => x !== c); this.descarte.push(c);
      this.casilla += 1;
      Claridad.sumar(cfg.claridadPorCasilla);
      if (r.aMedias) { Hud.decir(TEXTOS.aMedias, { ms: 6500, suave: true }); Audio.suavecito(); }
      else if (r.racha >= 2) { Hud.decir(`Paso pequeño encadenado: +${r.energia} energía (racha ×${r.racha}). Cada acción pequeña rinde más que la anterior.`, { ms: 4500 }); Audio.gota(); }
      else { Audio.gota(); }
    }
    Hud.setEnergia(this.energia, this.racha);
    capaJuego.querySelectorAll('.carta').forEach((b) => { b.disabled = true; });
    const espera = (c.esfuerzo === 0 ? 900 : 1300) * CONFIG.transicion;
    setTimeout(() => {
      if (this.casilla >= cfg.casillas) this.terminar(false);
      else this.irA('ELEGIR');
    }, Math.max(400, espera));
  },
  irAFaseSinPanel(fase) { this.fase = fase; Hud.setFases(ESTRATEGIAS.sendero.fases, fase); Fases.iniciar(`SENDERO_${fase}`); },

  /* ---- REGISTRAR: el mapa de lo que funcionó ---- */
  terminar(anticipado) {
    window.sessionLog.terminoAnticipadamente = anticipado;
    this.irA('REGISTRAR');
  },
  faseREGISTRAR() {
    capaJuego.innerHTML = '';
    Hud.setEnergia(null);
    const jugadas = this.historial.filter((h) => h.carta.esfuerzo > 0);
    const mejor = this.secuenciaMasEficiente();
    const maxE = CONFIG.sendero.energiaMaxima;
    otorgarHerramienta('semilla');
    Hud.panel({
      eyebrow: 'El sendero cubierto de bruma · REGISTRAR',
      titulo: 'El mapa de lo que funcionó',
      clase: 'ancho',
      html: `
        <div class="resumen"><span>Turnos: ${this.turno}</span><span>Casillas: ${this.casilla} de ${CONFIG.sendero.casillas}</span><span>Energía: ${CONFIG.sendero.energiaInicial} → ${Math.round(this.energia)}</span><span>Descansos: ${window.sessionLog.vecesQueDescanso}</span></div>
        <h3>Energía turno a turno</h3>
        <div class="grafica" aria-label="Energía por turno">${this.historial.map((h) => `<i style="height:${Math.max(4, (h.energia / maxE) * 100)}%" data-v="${h.energia}" title="Turno ${h.turno}: ${escapar(h.carta.nombre)} (${h.gano >= 0 ? '+' : ''}${h.gano})"></i>`).join('') || '<span class="nota">Sin turnos jugados.</span>'}</div>
        <h3>Cartas que jugaste</h3>
        <div class="lista-cartas">${this.historial.map((h) => `<span class="${h.carta.categoria}">${escapar(h.carta.nombre)} (+${h.gano})${h.aMedias ? ' · a medias' : ''}</span>`).join('') || '<span>Ninguna todavía</span>'}</div>
        ${mejor ? `<h3>Tu secuencia más eficiente</h3><div class="lista-cartas">${mejor.cartas.map((c) => `<span class="${c.categoria}">${escapar(c.nombre)}</span>`).join('')}</div><p class="nota">${mejor.cartas.length} pasos seguidos que devolvieron <strong>+${mejor.total}</strong> de energía${mejor.pequenos ? ': todos pequeños y encadenados' : ''}.</p>` : ''}
        <p class="clinico">${TEXTOS.senderoCierre}</p>
        <p class="nota">${HERRAMIENTAS.semilla.icono} <strong>${HERRAMIENTAS.semilla.nombre}</strong> se guarda en tu caja de herramientas.${jugadas.length === 0 ? ' Salir sin jugar cartas también cuenta: elegiste parar.' : ''}</p>`,
      botones: [{ texto: 'Ir a la caja de herramientas', primario: true, accion: () => Maquina.cambiar('CAJA_HERRAMIENTAS') }]
    });
  },
  /* Ventana de hasta 3 jugadas consecutivas (sin descansos) con mayor energía devuelta */
  secuenciaMasEficiente() {
    const acciones = this.historial.filter((h) => h.carta.esfuerzo > 0);
    let mejor = null;
    for (let i = 0; i < acciones.length; i += 1) {
      for (let n = 1; n <= 3 && i + n <= acciones.length; n += 1) {
        const tramo = acciones.slice(i, i + n);
        if (tramo.some((h, j) => j > 0 && h.turno !== tramo[j - 1].turno + 1)) break;   // solo turnos consecutivos
        const total = tramo.reduce((s, h) => s + h.gano, 0);
        if (!mejor || total > mejor.total || (total === mejor.total && n > mejor.cartas.length)) {
          mejor = { total, cartas: tramo.map((h) => h.carta), pequenos: tramo.every((h) => h.carta.esfuerzo <= 2) && n > 1 };
        }
      }
    }
    return mejor;
  },
  update(dt) {
    this.t += dt;
    Motas.update(dt, GameState.claridad);
    const destino = Valle.posCasilla(this.casilla, CONFIG.sendero.casillas);
    const v = 1 - Math.exp(-dt * (REDUCIR_MOVIMIENTO ? 6 : 2.2));
    this.personaje.x += (destino.x - this.personaje.x) * v; this.personaje.y += (destino.y - this.personaje.y) * v;
  },
  render(ctx) {
    const k = GameState.claridad;
    Valle.dibujar(ctx, { t: this.t, k, modo: 'sendero', casillas: { total: CONFIG.sendero.casillas, actual: this.casilla } });
    dibujarPersonaje(ctx, this.personaje.x, this.personaje.y + 8, { t: this.t, k, escala: 0.75 });
    Motas.dibujar(ctx, k); Valle.bruma(ctx, this.t, k);
  }
};

/* ------------------------------------------------------ CAJA_HERRAMIENTAS */
function otorgarHerramienta(id) {
  GameState.herramientas.add(id);
  GameState.ultimaHerramienta = id;
  window.sessionLog.recompensaObtenida = HERRAMIENTAS[id].nombre;
  Audio.exito();
}

Maquina.estados.CAJA_HERRAMIENTAS = {
  t: 0,
  entrar() {
    Hud.setFases(null); Hud.setEnergia(null);
    Fases.iniciar('CAJA_HERRAMIENTAS');
    const nueva = GameState.ultimaHerramienta;
    Hud.panel({
      eyebrow: 'Recompensa guardada',
      titulo: TEXTOS.caja,
      html: `<div class="herramientas">${Object.values(HERRAMIENTAS).map((h) => `
          <div class="herramienta ${GameState.herramientas.has(h.id) ? 'obtenida' : ''} ${h.id === nueva ? 'nueva' : ''}">
            <span class="icono" aria-hidden="true">${h.icono}</span>
            <strong>${h.nombre}</strong>
            <span>${h.estrategia}</span>
            <span class="estado">${h.id === nueva ? '¡Nueva!' : GameState.herramientas.has(h.id) ? 'Obtenida' : 'Pendiente'}</span>
          </div>`).join('')}</div>
        ${GameState.registros.length ? `<h3>Frases guardadas</h3><ul class="registros">${GameState.registros.map((f) => `<li>“${escapar(f)}”</li>`).join('')}</ul>` : ''}
        <p class="nota">Cada herramienta es una forma de acompañar la tristeza que ya practicaste. Puedes volver por la otra cuando quieras.</p>`,
      botones: [{ texto: 'Continuar', primario: true, accion: () => Maquina.cambiar('REEVALUACION') }]
    });
  },
  salir() { Fases.cerrar(); },
  update(dt) { this.t += dt; Motas.update(dt, GameState.claridad); },
  render(ctx) { const k = GameState.claridad; Valle.dibujar(ctx, { t: this.t, k }); dibujarPersonaje(ctx, 250, 560, { t: this.t, k }); Motas.dibujar(ctx, k); Valle.bruma(ctx, this.t, k); }
};

/* ---------------------------------------------------------- REEVALUACION */
Maquina.estados.REEVALUACION = {
  t: 0,
  entrar() {
    Fases.iniciar('REEVALUACION');
    const p = Hud.panel({
      eyebrow: 'Reevaluación de intensidad',
      titulo: TEXTOS.reevaluacion,
      html: `<p>Al llegar la valoraste como <strong>${GameState.intensidadInicial}</strong>. No hay respuesta correcta: elige lo que sientas ahora.</p>
             <div class="opciones fila">${['BAJA', 'MEDIA', 'ALTA'].map((n) => `<button class="opcion grande" type="button" data-n="${n}">${n}</button>`).join('')}</div>`
    });
    p.querySelectorAll('[data-n]').forEach((b) => b.addEventListener('click', () => {
      GameState.intensidadFinal = b.dataset.n;
      Audio.pling();
      Maquina.cambiar('FEEDBACK');
    }));
  },
  salir() { Fases.cerrar(); },
  update(dt) { this.t += dt; Motas.update(dt, GameState.claridad); },
  render(ctx) { const k = GameState.claridad; Valle.dibujar(ctx, { t: this.t, k }); dibujarPersonaje(ctx, 250, 560, { t: this.t, k }); Motas.dibujar(ctx, k); Valle.bruma(ctx, this.t, k); }
};

/* -------------------------------------------------------------- FEEDBACK */
Maquina.estados.FEEDBACK = {
  t: 0,
  entrar() {
    Fases.iniciar('FEEDBACK');
    const ini = GameState.intensidadInicial; const fin = GameState.intensidadFinal;
    const d = ORDEN_INTENSIDAD[fin] - ORDEN_INTENSIDAD[ini];
    const direccion = d < 0 ? 'disminuyó' : d > 0 ? 'aumentó' : 'se mantiene';
    const texto = d < 0 ? TEXTOS.disminuyo : d > 0 ? TEXTOS.aumento : TEXTOS.mantiene;
    const log = window.sessionLog;
    log.intensidadFinal = fin;
    log.direccionDelCambio = direccion;
    Fases.cerrar();
    log.fin = new Date().toISOString();
    window.sessionLogs.push(log);
    console.log('[Valle de la Bruma] sessionLog', JSON.parse(JSON.stringify(log)));
    console.table?.(log.tiempoPorFase);

    const otra = GameState.estrategiaElegida === 'rio' ? ESTRATEGIAS.sendero : ESTRATEGIAS.rio;
    Hud.panel({
      eyebrow: 'Retroalimentación',
      titulo: `Tu tristeza ${direccion}`,
      html: `<div class="resumen"><span>Al llegar: ${ini}</span><span>Ahora: ${fin}</span><span>${log.recompensaObtenida ? HERRAMIENTAS[GameState.ultimaHerramienta].icono + ' ' + log.recompensaObtenida : ''}</span></div>
             <p class="clinico">${texto}</p>
             <p class="nota">Otro camino disponible: <strong>${otra.camino}</strong> (${otra.nombre}).</p>
             <pre class="registro" data-registro hidden></pre>`,
      botones: [
        { texto: TEXTOS.btnPracticar, primario: true, accion: () => this.practicarOtra() },
        { texto: 'Ver registro de sesión', accion: (panel) => { const pre = panel.querySelector('[data-registro]'); pre.hidden = !pre.hidden; pre.textContent = JSON.stringify(log, null, 2); } }
      ]
    });
  },
  practicarOtra() {
    // nueva partida: se llega con la intensidad que se acaba de reportar
    GameState.intensidadInicial = GameState.intensidadFinal;
    GameState.estrategiaSugerida = CONFIG.sugeridaPorIntensidad[GameState.intensidadInicial];
    GameState.intensidadFinal = null;
    window.sessionLog = nuevoSessionLog();
    Maquina.cambiar('MENU_ESTRATEGIA');
  },
  update(dt) { this.t += dt; Motas.update(dt, GameState.claridad); },
  render(ctx) { const k = GameState.claridad; Valle.dibujar(ctx, { t: this.t, k }); dibujarPersonaje(ctx, 250, 560, { t: this.t, k }); Motas.dibujar(ctx, k); Valle.bruma(ctx, this.t, k); }
};

/* ============================================================================
   BUCLE PRINCIPAL · requestAnimationFrame con deltaTime acotado
   ========================================================================== */
let ultimo = performance.now();
function bucle(ahora) {
  const dt = Math.min(0.05, (ahora - ultimo) / 1000);
  ultimo = ahora;
  Claridad.update(dt);
  Maquina.actual?.update(dt);
  ctx2d.setTransform(1, 0, 0, 1, 0, 0);
  Maquina.actual?.render(ctx2d);
  Audio.update();
  requestAnimationFrame(bucle);
}
Maquina.cambiar('MENU_ESTRATEGIA');
requestAnimationFrame(bucle);

// acceso para pruebas y depuración
window.ValleDeLaBruma = { Maquina, GameState, CONFIG, TEXTOS, Hud, Audio, Rumia, Claridad };
</script>
