<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>El Valle de la Luz · Alegría de intensidad alta</title>
<!--
  ============================================================================
  EL VALLE DE LA LUZ · ALEGRÍA DE INTENSIDAD ALTA
  Dos mini-juegos psicoeducativos en un solo archivo (HTML + CSS + JS, canvas 2D
  y Web Audio API). Sin librerías ni recursos externos: todo se dibuja y suena
  por código.

  MAPA MECÁNICA → FASE PSICOEDUCATIVA → CONSTRUCTO TEÓRICO
  ----------------------------------------------------------------------------
  | Mecánica                                   | Fase             | Constructo                                              |
  |--------------------------------------------|------------------|---------------------------------------------------------|
  | Mantener pulsado con calma baja el medidor | DETENERSE (M1)   | Regulación de la activación; el escenario (brillo,      |
  | de activación; machacar lo sube            |                  | partículas, tempo, velocidad) es función del estado     |
  |                                            |                  | emocional → conciencia interoceptiva de la intensidad    |
  | Detener el foco 1,5 s sobre 5 elementos    | OBSERVAR (M1)    | Bryant & Veroff: atención hacia lo positivo del entorno  |
  | (la permanencia cuenta, el clic no)        |                  | (savoring: proceso de "atención consciente")             |
  | Micro-pregunta por elemento, 3 opciones    | APRECIAR (M1)    | Bryant & Veroff: apreciación y elaboración del           |
  | todas válidas                              |                  | significado; consolida el recuerdo de la experiencia     |
  | Medidor estabilizado en zona media +       | CONTINUAR (M1)   | Regular ≠ eliminar: se conserva la alegría a un nivel    |
  | mensaje clínico                            |                  | que permite seguir                                       |
  | Barra de energía = alegría intensa; se     | ACTIVAR (M2)     | Fredrickson (ampliación y construcción): la emoción      |
  | gasta al actuar y se recupera con destellos|                  | positiva es un recurso que amplía el repertorio          |
  | Tres rutas: movimiento / exploración /     | DIRIGIR (M2)     | Fredrickson: tendencias de acción de juego (movimiento), |
  | creatividad, todas válidas                 |                  | exploración y creación; decisión propia                  |
  | Obstáculos que cuestan energía, destellos  | ACTUAR (M2)      | Canalización de la activación hacia una meta; sin        |
  | que la reponen, sin castigo al llegar a 0  |                  | castigo → construcción de recursos, no supresión         |
  | Activar el mecanismo de luz estabiliza el  | COMPLETAR (M2)   | Cierre orientado a objetivos: la activación se convierte |
  | escenario                                  |                  | en logro constructivo                                    |
  | Selección de estrategia con sugerencia no  | Flujo compartido | Autonomía: la estrategia sugerida orienta, no obliga     |
  | obligatoria                                |                  |                                                         |
  | Reevaluación BAJA/MEDIA/ALTA sin respuesta | Flujo compartido | Metacognición emocional: comparar intensidad inicial     |
  | correcta + retroalimentación               |                  | y final (recuerdo y valoración de la experiencia)        |
  ----------------------------------------------------------------------------

  CÓMO PROBARLO (menos de 5 minutos)
  1. Abre este archivo con doble clic en cualquier navegador moderno (Chrome,
     Edge, Firefox, Safari). No hace falta servidor. Para una pasada rápida con
     umbrales cortos: añade `?rapido=1` a la URL.
  2. Pantalla de estrategia: pulsa "VER OTRAS ESTRATEGIAS" para ver el aviso de
     estrategia no sugerida; vuelve a la sugerida o quédate con la otra y pulsa
     "CONTINUAR CON ESTA ESTRATEGIA".
  3. Mini-juego 1 (Disfruta sin perder el control), ~90 s:
     · DETENERSE: mantén pulsada la barra espaciadora (o el dedo en la pantalla)
       con calma. Prueba a machacar la tecla: el medidor sube. Llévalo a la zona
       verde (≤35) y mantenlo 3 s.
     · OBSERVAR: mueve el ratón (o el dedo / flechas) y deja el foco quieto 1,5 s
       sobre la flor, el ave, el reflejo, el rayo de sol y el personaje. Con 3
       aparece "Continuar"; con 5, bonus.
     · APRECIAR: responde una pregunta por elemento (todas las opciones valen).
     · CONTINUAR: lee el mensaje y guarda la ⭐ Estrella del disfrute.
  4. Caja de herramientas → Reevaluación (BAJA/MEDIA/ALTA) → Retroalimentación.
     Pulsa "PRACTICAR OTRA ESTRATEGIA".
  5. Mini-juego 2 (Utiliza tu energía), ~90 s: ACTIVAR (lee) → DIRIGIR (elige
     ruta) → ACTUAR:
     · Movimiento: flechas/A-D para moverte, ESPACIO para saltar (cada salto
       gasta energía); recoge destellos. Deja que la energía llegue a 0 para ver
       "Toma un momento…" y los destellos cercanos.
     · Exploración: flechas/WASD o tocar una casilla vecina; iluminar cuesta
       energía, las compuertas también; hay una ruta oculta.
     · Creatividad: flechas para moverte, E (o el botón ✦) para colocar puentes
       y bloques de luz; ESPACIO da un salto corto.
     Al final, ESPACIO sobre el mecanismo → COMPLETAR → ⚡ Rayo de energía.
  6. En la consola: `sessionLog` (partida actual) y `sessionLogs` (todas).
     `exportarSessionLog()` devuelve el JSON.
  ============================================================================
-->
<style>
  :root {
    --oro: #f5b642;
    --ambar: #e08a1e;
    --crema: #fff7e4;
    --tinta: #2a2114;
    --tinta-suave: #5a4a30;
    --verde: #6fbf73;
    --verde-claro: #d8f0c8;
    --panel: rgba(255, 250, 238, 0.96);
    --sombra: 0 18px 50px rgba(70, 40, 0, 0.28);
    --fuente: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", sans-serif;
    --texto: clamp(16px, 1.55vw, 20px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #1d160c; color: var(--tinta); font-family: var(--fuente); overflow: hidden; }
  button { font: inherit; }

  /* ---------------------------------------------------------------- marco */
  #marco { position: fixed; inset: 0; display: grid; place-items: center; }
  #escena { position: relative; width: 1280px; height: 720px; }
  #lienzo { display: block; width: 100%; height: 100%; border-radius: 14px; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45); touch-action: none; }
  #capa { position: absolute; inset: 0; pointer-events: none; }
  #capa > * { pointer-events: auto; }

  /* ------------------------------------------------------------------ HUD */
  #hud { position: absolute; top: 12px; left: 14px; right: 14px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; pointer-events: none; }
  #hud > * { pointer-events: auto; }
  #fases { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 12px; border-radius: 999px; background: rgba(42, 33, 20, 0.72); color: #fff; font-size: clamp(14px, 1.2vw, 17px); letter-spacing: 0.06em; font-weight: 700; backdrop-filter: blur(6px); }
  #fases:empty { display: none; }
  #fases span { opacity: 0.45; }
  #fases span.hecha { opacity: 0.8; }
  #fases span.actual { opacity: 1; color: var(--oro); }
  #fases i { font-style: normal; opacity: 0.4; }
  #opciones { display: flex; gap: 8px; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 6px 12px; border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 999px; background: rgba(42, 33, 20, 0.72); color: #fff; font-size: 16px; cursor: pointer; backdrop-filter: blur(6px); }
  .chip input { accent-color: var(--oro); width: 18px; height: 18px; }

  /* medidor vertical de activación (M1) */
  #medidor { position: absolute; left: 22px; top: 50%; transform: translateY(-50%); display: grid; justify-items: center; gap: 8px; padding: 12px 10px; border-radius: 16px; background: rgba(42, 33, 20, 0.72); color: #fff; backdrop-filter: blur(6px); }
  #medidor[hidden] { display: none; }
  #medidor .titulo { font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; }
  #medidor .tubo { position: relative; width: 26px; height: min(300px, 40vh); border-radius: 999px; overflow: hidden; background: linear-gradient(180deg, #ffb347 0%, #ffd166 35%, #d9e67a 65%, #6fbf73 100%); }
  #medidor .tubo::after { content: ''; position: absolute; left: 0; right: 0; top: 0; height: var(--vacio, 0%); background: rgba(30, 22, 10, 0.78); transition: height 120ms linear; }
  #medidor .zona { position: absolute; left: -4px; right: -4px; top: 65%; height: 2px; background: #fff; opacity: 0.7; }
  #medidor .valor { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
  #medidor .etiqueta { font-size: 14px; opacity: 0.85; }

  /* barra horizontal de energía (M2) */
  #energia { position: absolute; left: 50%; top: 66px; transform: translateX(-50%); width: min(520px, 70%); padding: 8px 14px 10px; border-radius: 14px; background: rgba(42, 33, 20, 0.72); color: #fff; backdrop-filter: blur(6px); }
  #energia[hidden] { display: none; }
  #energia .fila { display: flex; justify-content: space-between; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; margin-bottom: 6px; }
  #energia .pista { height: 14px; border-radius: 999px; background: rgba(255, 255, 255, 0.18); overflow: hidden; }
  #energia .relleno { height: 100%; width: 100%; border-radius: 999px; background: linear-gradient(90deg, #fff2b0, #ffd166, #f5b642); box-shadow: 0 0 14px rgba(255, 209, 102, 0.8); transition: width 140ms linear; }

  /* mensaje breve sobre el juego */
  #mensaje { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); max-width: min(760px, 90%); padding: 12px 20px; border-radius: 14px; background: rgba(42, 33, 20, 0.78); color: #fff; font-size: var(--texto); line-height: 1.4; text-align: center; backdrop-filter: blur(6px); animation: aparecer 260ms ease; }
  #mensaje[hidden] { display: none; }
  #mensaje.suave { background: rgba(255, 250, 238, 0.92); color: var(--tinta); }

  /* controles táctiles */
  #tactil { position: absolute; inset: 0; pointer-events: none; }
  #tactil[hidden] { display: none; }
  #tactil button { pointer-events: auto; position: absolute; width: 64px; height: 64px; border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 50%; background: rgba(42, 33, 20, 0.62); color: #fff; font-size: 24px; font-weight: 800; cursor: pointer; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #tactil button.grande { width: 84px; height: 84px; background: rgba(245, 182, 66, 0.85); color: var(--tinta); }
  #tactil button:active, #tactil button.pulsado { filter: brightness(1.2); transform: scale(0.96); }
  #tactil .izq { left: 20px; bottom: 90px; }
  #tactil .der { left: 100px; bottom: 90px; }
  #tactil .arr { left: 60px; bottom: 160px; }
  #tactil .aba { left: 60px; bottom: 20px; }
  #tactil .a { right: 24px; bottom: 90px; }
  #tactil .b { right: 120px; bottom: 90px; }
  #tactil .sostener { left: 50%; bottom: 90px; transform: translateX(-50%); width: 150px; height: 150px; font-size: 18px; letter-spacing: 0.08em; }

  /* -------------------------------------------------------------- paneles */
  #paneles { position: absolute; inset: 0; display: grid; place-items: center; padding: 64px 16px 16px; pointer-events: none; }
  #paneles:empty { display: none; }
  .panel { pointer-events: auto; width: min(640px, 100%); max-height: 100%; overflow-y: auto; padding: clamp(18px, 2.6vw, 30px) clamp(18px, 3vw, 34px); border-radius: 22px; background: var(--panel); border: 1px solid rgba(224, 138, 30, 0.35); box-shadow: var(--sombra); animation: aparecer 300ms cubic-bezier(0.22, 1, 0.36, 1); font-size: var(--texto); line-height: 1.5; }
  .panel.ancho { width: min(900px, 100%); }
  .panel.abajo { align-self: end; }
  .panel .eyebrow { margin: 0 0 6px; font-size: clamp(13px, 1.1vw, 15px); letter-spacing: 0.2em; text-transform: uppercase; color: var(--ambar); font-weight: 800; }
  .panel h2 { margin: 0 0 10px; font-size: clamp(22px, 2.4vw, 30px); line-height: 1.15; color: var(--tinta); }
  .panel h3 { margin: 12px 0 8px; font-size: clamp(18px, 1.8vw, 22px); }
  .panel p { margin: 0 0 10px; color: var(--tinta-suave); }
  .panel p.cita { padding: 10px 14px; border-left: 4px solid var(--oro); background: #fff3d6; color: var(--tinta); font-style: italic; }
  .panel p.clinico { padding: 14px 16px; border-radius: 12px; background: #fff3d6; color: var(--tinta); font-weight: 600; font-size: clamp(17px, 1.7vw, 22px); line-height: 1.45; }
  .panel p.nota { font-size: clamp(15px, 1.3vw, 17px); }
  .acciones { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .boton { min-height: 46px; padding: 10px 18px; border: 1px solid rgba(42, 33, 20, 0.2); border-radius: 12px; background: #fff; color: var(--tinta); font-weight: 800; letter-spacing: 0.04em; cursor: pointer; transition: transform 140ms ease, background 160ms ease; }
  .boton:hover { transform: translateY(-1px); background: #fff9ea; }
  .boton.primario { background: linear-gradient(180deg, #ffd166, #f5b642); border-color: transparent; }
  .boton.secundario { background: rgba(255, 255, 255, 0.6); }
  .boton:focus-visible, .tarjeta:focus-visible, .chip:focus-within { outline: 3px solid var(--ambar); outline-offset: 3px; }
  .boton[disabled] { opacity: 0.5; cursor: default; transform: none; }

  /* tarjetas de estrategia / ruta */
  .tarjetas { display: grid; gap: 12px; margin: 12px 0 4px; }
  .tarjetas.tres { grid-template-columns: repeat(3, 1fr); }
  .tarjeta { position: relative; display: grid; gap: 4px; padding: 16px 16px 14px; border: 2px solid rgba(42, 33, 20, 0.15); border-radius: 16px; background: #fff; text-align: left; cursor: pointer; transition: border-color 160ms ease, transform 160ms ease, box-shadow 160ms ease; }
  .tarjeta:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(70, 40, 0, 0.12); }
  .tarjeta.seleccionada { border-color: var(--ambar); box-shadow: 0 0 0 4px rgba(245, 182, 66, 0.25); }
  .tarjeta .etiqueta { position: absolute; top: -12px; right: 14px; padding: 4px 10px; border-radius: 999px; background: var(--verde); color: #fff; font-size: 13px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
  .tarjeta strong { font-size: clamp(18px, 1.8vw, 22px); color: var(--tinta); }
  .tarjeta em { font-style: normal; color: var(--ambar); font-weight: 700; font-size: clamp(15px, 1.3vw, 17px); }
  .tarjeta span { color: var(--tinta-suave); font-size: clamp(15px, 1.3vw, 17px); }
  .tarjeta small { margin-top: 4px; color: var(--tinta-suave); font-size: 14px; letter-spacing: 0.06em; }
  .aviso { padding: 12px 14px; border-radius: 12px; background: var(--verde-claro); color: var(--tinta); font-size: clamp(15px, 1.35vw, 18px); }
  .aviso[hidden] { display: none; }

  /* opciones (APRECIAR, reevaluación) */
  .opciones { display: grid; gap: 10px; margin-top: 10px; }
  .opciones.fila { grid-template-columns: repeat(3, 1fr); }
  .opcion { min-height: 52px; padding: 12px 16px; border: 2px solid rgba(42, 33, 20, 0.15); border-radius: 14px; background: #fff; font-weight: 700; cursor: pointer; text-align: left; transition: border-color 160ms ease, transform 140ms ease; }
  .opcion:hover { border-color: var(--ambar); transform: translateY(-1px); }
  .opcion.grande { text-align: center; font-size: clamp(18px, 2vw, 24px); letter-spacing: 0.08em; }

  /* caja de herramientas */
  .herramientas { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0; }
  .herramienta { display: grid; gap: 4px; justify-items: center; padding: 18px 12px; border-radius: 16px; background: #fff; border: 2px solid rgba(42, 33, 20, 0.12); text-align: center; opacity: 0.45; }
  .herramienta.obtenida { opacity: 1; border-color: var(--oro); }
  .herramienta.nueva { animation: latido 1.2s ease 2; box-shadow: 0 0 0 6px rgba(245, 182, 66, 0.25); }
  .herramienta .icono { font-size: 44px; line-height: 1; }
  .herramienta strong { font-size: clamp(16px, 1.5vw, 19px); }
  .herramienta span { font-size: 14px; color: var(--tinta-suave); }
  .herramienta .estado { font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 800; color: var(--ambar); }

  /* barra demo de energía en ACTIVAR */
  .demo-energia { height: 18px; border-radius: 999px; background: rgba(42, 33, 20, 0.12); overflow: hidden; margin: 10px 0 14px; }
  .demo-energia i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #fff2b0, #ffd166, #f5b642); animation: latido 2.4s ease-in-out infinite; }

  pre.registro { max-height: 32vh; overflow: auto; padding: 12px; border-radius: 12px; background: #2a2114; color: #ffe9b8; font-size: 14px; line-height: 1.4; }
  .resumen { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0 10px; }
  .resumen span { padding: 6px 12px; border-radius: 999px; background: #fff; border: 1px solid rgba(42, 33, 20, 0.15); font-weight: 700; font-size: 15px; }

  @keyframes aparecer { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes latido { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }

  @media (max-width: 760px) {
    .tarjetas.tres { grid-template-columns: 1fr; }
    .opciones.fila { grid-template-columns: 1fr; }
    .herramientas { grid-template-columns: 1fr; }
    #medidor .tubo { height: 34vh; }
    #fases { font-size: 13px; padding: 6px 10px; }
  }
  @media (max-height: 460px) {
    #paneles { padding: 54px 10px 8px; }
    .panel { padding: 12px 16px; border-radius: 16px; }
    .panel h2 { font-size: 20px; margin-bottom: 6px; }
    .panel p { margin-bottom: 6px; }
    .tarjeta { padding: 10px 12px; }
    .herramienta { padding: 10px; }
    .herramienta .icono { font-size: 30px; }
    #energia { top: 58px; padding: 6px 12px 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .panel, #mensaje { animation: none; }
    .herramienta.nueva { animation: none; }
  }
</style>
</head>
<body>
<div id="marco">
  <div id="escena">
    <canvas id="lienzo" width="1280" height="720" aria-label="El Valle de la Luz"></canvas>
    <div id="capa">
      <header id="hud">
        <div id="fases" aria-live="polite"></div>
        <div id="opciones">
          <label class="chip" title="Menos partículas y destellos"><input type="checkbox" id="chkBaja" /> Baja estimulación</label>
          <button class="chip" id="btnSonido" type="button" aria-pressed="true">🔊 Sonido</button>
        </div>
      </header>
      <div id="medidor" hidden aria-live="polite">
        <span class="titulo">Activación</span>
        <div class="tubo"><span class="zona" aria-hidden="true"></span></div>
        <span class="valor" data-valor>100</span>
        <span class="etiqueta" data-etiqueta>alta</span>
      </div>
      <div id="energia" hidden aria-live="polite">
        <div class="fila"><span>⚡ Energía</span><span data-valor>100 %</span></div>
        <div class="pista"><div class="relleno" data-relleno></div></div>
      </div>
      <div id="tactil" hidden></div>
      <div id="mensaje" hidden aria-live="polite"></div>
      <div id="paneles"></div>
    </div>
  </div>
</div>

<script>
'use strict';

/* ============================================================================
   CONFIG · constantes de balance. Un diseñador puede ajustarlas sin tocar la
   lógica. `pruebaRapida` (URL ?rapido=1) acorta umbrales para recorrer todo
   en pocos minutos.
   ========================================================================== */
const RAPIDO = new URLSearchParams(location.search).has('rapido');
const CONFIG = {
  ancho: 1280,
  alto: 720,
  intensidadInicial: 'ALTA',
  estrategiaSugerida: 'pausa',          // 'pausa' | 'energia'
  velocidadEscena: 320,                 // px/s del desplazamiento del valle a activación 100
  particulasMaximo: 220,
  bajaEstimulacionFactor: 0.3,          // fracción de partículas / brillo con el modo activado
  m1: {
    activacionInicial: 100,
    bajadaSostenida: 9,                 // puntos/s mientras se mantiene pulsado con calma
    subidaReposo: 1.6,                  // puntos/s cuando no se pulsa (invita a sostener)
    subidaErratica: 7,                  // puntos por pulsación rápida de más
    ventanaErratica: 1.2,               // s: tres o más pulsaciones en esta ventana = errático
    pulsacionCorta: 0.25,               // s: una pulsación más corta que esto es "machacar"
    zonaVerde: 35,
    zonaMediaMax: 65,
    segundosEnVerde: RAPIDO ? 1 : 3,
    observarPermanencia: RAPIDO ? 0.6 : 1.5,   // s de foco quieto sobre un elemento
    observarRadio: 78,
    observarMinimo: 3,
    activacionFinal: 50                 // zona media al CONTINUAR
  },
  m2: {
    energiaInicial: 100,
    energiaMaxima: 100,
    destello: 15,                       // energía que repone cada destello
    costoSalto: 14,
    costoIluminar: 3,
    costoCompuerta: 12,
    costoPieza: 22,
    umbralRecuperado: 20,               // energía con la que termina el modo "toma un momento"
    velocidad: 270,                     // px/s
    velocidadSinEnergia: 110,
    gravedad: 1500,
    impulsoSalto: 600,
    impulsoSaltoCorto: 380,
    pasoLaberinto: 0.14,                // s por casilla
    pasoLaberintoLento: 0.34
  },
  audio: { bpmMin: 66, bpmMax: 150, filtroMin: 420, filtroMax: 4200, volumen: 0.22 }
};

/* ----------------------------------------------------------------------------
   TEXTOS · contenido clínico validado. Se usan literales, no se reescriben.
   -------------------------------------------------------------------------- */
const TEXTOS = {
  intensidadAlta: 'La alegría es muy intensa y necesito organizar mi activación antes de continuar.',
  intro: 'La emoción es muy intensa. Haz una pausa y selecciona una estrategia para organizar tu activación y continuar de manera adecuada.',
  otraEstrategia: 'Esta estrategia también puede utilizarse. La estrategia sugerida responde a la intensidad que identificaste, pero puedes explorar otra forma de regular y canalizar tu alegría.',
  preguntaApreciar: '¿Qué hace significativo este momento para ti?',
  m1Cierre: 'Puedes experimentar una emoción positiva intensa sin necesidad de actuar inmediatamente.',

/* ============================================================================
   UTILIDADES
   ========================================================================== */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const suave = (t) => t * t * (3 - 2 * t);
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);

/* Mezcla dos colores hex según k (0 = a, 1 = b). Cacheada: se llama cada frame. */
const _cacheColor = new Map();
function hexRgb(h) {
  if (_cacheColor.has(h)) return _cacheColor.get(h);
  const n = parseInt(h.slice(1), 16);
  const rgb = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  _cacheColor.set(h, rgb);
  return rgb;
}
function mezcla(a, b, k, alfa = 1) {
  const A = hexRgb(a);
  const B = hexRgb(b);
  const t = clamp(k, 0, 1);
  return `rgba(${Math.round(lerp(A[0], B[0], t))},${Math.round(lerp(A[1], B[1], t))},${Math.round(lerp(A[2], B[2], t))},${alfa})`;
}
/* Ruido determinista (sin Math.random) para posiciones estables del paisaje */
function ruido(i) {
  const x = Math.sin(i * 127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);
}

/* ============================================================================
   AUDIO · Web Audio API. Un arpegio pentatónico suave cuyo tempo, filtro y
   densidad siguen la intensidad (activación o energía). Nada de archivos.
   ========================================================================== */
const Audio = {
  ctx: null, master: null, filtro: null, listo: false,
  bpm: 120, siguiente: 0, paso: 0, intensidad: 1,
  escala: [0, 2, 4, 7, 9, 12, 14, 16],        // pentatónica mayor (semitonos sobre la tónica)
  tonica: 261.63,                              // Do4

  init() {
    if (this.listo) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = GameState.sonido ? CONFIG.audio.volumen : 0;
      this.filtro = this.ctx.createBiquadFilter();
      this.filtro.type = 'lowpass';
      this.filtro.frequency.value = CONFIG.audio.filtroMax;
      this.filtro.connect(this.master).connect(this.ctx.destination);
      this.siguiente = this.ctx.currentTime + 0.1;
      this.listo = true;
      this.drone();
    } catch (e) { this.listo = false; }
  },
  reanudar() { if (this.listo && this.ctx.state === 'suspended') this.ctx.resume(); },
  setSonido(on) {
    GameState.sonido = on;
    if (this.listo) this.master.gain.setTargetAtTime(on ? CONFIG.audio.volumen : 0, this.ctx.currentTime, 0.05);
  },
  /* La intensidad (0..1) manda: más rápido, más brillante y más denso arriba */
  setIntensidad(k) {
    this.intensidad = clamp(k, 0, 1);
    this.bpm = lerp(CONFIG.audio.bpmMin, CONFIG.audio.bpmMax, this.intensidad);
    if (this.listo) {
      const f = lerp(CONFIG.audio.filtroMin, CONFIG.audio.filtroMax, this.intensidad);
      this.filtro.frequency.setTargetAtTime(f, this.ctx.currentTime, 0.25);
    }
  },
  drone() {
    const o = this.ctx.createOscillator();
    o.type = 'triangle';
    o.frequency.value = this.tonica / 2;
    const g = this.ctx.createGain();
    g.gain.value = 0.08;
    o.connect(g).connect(this.filtro);
    o.start();
  },
  nota(freq, t, dur = 0.35, vol = 0.18, tipo = 'sine') {
    if (!this.listo) return;
    const o = this.ctx.createOscillator();
    o.type = tipo;
    o.frequency.value = freq;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.filtro);
    o.start(t);
    o.stop(t + dur + 0.05);
  },
  /* Planifica el arpegio con adelanto sobre el reloj del contexto */
  update() {
    if (!this.listo || this.ctx.state !== 'running') return;
    const ahora = this.ctx.currentTime;
    const paso = 60 / this.bpm / 2;   // corcheas
    while (this.siguiente < ahora + 0.15) {
      const i = this.paso % 8;
      // a poca intensidad suenan menos notas: la textura se aclara
      const densa = this.intensidad > 0.66 || (this.intensidad > 0.33 ? i % 2 === 0 : i % 4 === 0);
      if (densa) {
        const grado = this.escala[[0, 2, 4, 5, 3, 6, 4, 1][i]];
        const freq = this.tonica * Math.pow(2, grado / 12);
        this.nota(freq, this.siguiente, paso * 1.6, 0.14 + 0.08 * this.intensidad);
      }
      this.siguiente += paso;
      this.paso += 1;
    }
  },
  /* Sonidos puntuales, todos suaves */
  pling(alto = 0) {
    if (!this.listo) return;
    const t = this.ctx.currentTime;
    this.nota(this.tonica * Math.pow(2, (7 + alto) / 12), t, 0.4, 0.2);
    this.nota(this.tonica * Math.pow(2, (12 + alto) / 12), t + 0.08, 0.5, 0.16);
  },
  exito() {
    if (!this.listo) return;
    const t = this.ctx.currentTime;
    [0, 4, 7, 12].forEach((s, i) => this.nota(this.tonica * Math.pow(2, s / 12), t + i * 0.12, 0.7, 0.18));
  },
  suave() {
    if (!this.listo) return;
    this.nota(this.tonica * 0.75, this.ctx.currentTime, 0.35, 0.12, 'triangle');
  },
  gasto() {
    if (!this.listo) return;
    this.nota(this.tonica * 2, this.ctx.currentTime, 0.12, 0.1, 'triangle');
  }
};
